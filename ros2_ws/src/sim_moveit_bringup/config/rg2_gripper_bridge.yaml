rg2_gripper_bridge:
  ros__parameters:
    articulation_path: /World/onrobot_rg2
    joint_state_topic: /joint_states
    joint_command_topic: /joint_command
    gripper_command_topic: /rg2/command_width
    open_width_m: 0.085
    closed_width_m: 0.0
    max_q: 1.18
    invert_command: false
    smooth_motion: true
    motion_duration_sec: 0.5
    command_rate_hz: 60.0
    command_tolerance: 0.001
    joint_multiplier_preset: preset_2_mirrored_signs
    rg2_joint_names:
      - onrobot_rg2_body_to_finger_1_origin_joint
      - onrobot_rg2_body_to_finger_2_origin_joint
      - onrobot_rg2_finger_1_origin_to_moment_arm_joint
      - onrobot_rg2_finger_1_origin_to_truss_arm_joint
      - onrobot_rg2_finger_1_truss_arm_to_finger_tip_joint
      - onrobot_rg2_finger_2_origin_to_moment_arm_joint
      - onrobot_rg2_finger_2_origin_to_truss_arm_joint
      - onrobot_rg2_finger_2_truss_arm_to_finger_tip_joint
    rg2_joint_targets.onrobot_rg2_body_to_finger_1_origin_joint.multiplier: 1.0
    rg2_joint_targets.onrobot_rg2_body_to_finger_1_origin_joint.offset: 0.0
    rg2_joint_targets.onrobot_rg2_body_to_finger_2_origin_joint.multiplier: -1.0
    rg2_joint_targets.onrobot_rg2_body_to_finger_2_origin_joint.offset: 0.0
    rg2_joint_targets.onrobot_rg2_finger_1_origin_to_moment_arm_joint.multiplier: -1.0
    rg2_joint_targets.onrobot_rg2_finger_1_origin_to_moment_arm_joint.offset: 0.0
    rg2_joint_targets.onrobot_rg2_finger_1_origin_to_truss_arm_joint.multiplier: -1.0
    rg2_joint_targets.onrobot_rg2_finger_1_origin_to_truss_arm_joint.offset: 0.0
    rg2_joint_targets.onrobot_rg2_finger_1_truss_arm_to_finger_tip_joint.multiplier: -1.0
    rg2_joint_targets.onrobot_rg2_finger_1_truss_arm_to_finger_tip_joint.offset: 0.0
    rg2_joint_targets.onrobot_rg2_finger_2_origin_to_moment_arm_joint.multiplier: 1.0
    rg2_joint_targets.onrobot_rg2_finger_2_origin_to_moment_arm_joint.offset: 0.0
    rg2_joint_targets.onrobot_rg2_finger_2_origin_to_truss_arm_joint.multiplier: 1.0
    rg2_joint_targets.onrobot_rg2_finger_2_origin_to_truss_arm_joint.offset: 0.0
    rg2_joint_targets.onrobot_rg2_finger_2_truss_arm_to_finger_tip_joint.multiplier: 1.0
    rg2_joint_targets.onrobot_rg2_finger_2_truss_arm_to_finger_tip_joint.offset: 0.0
