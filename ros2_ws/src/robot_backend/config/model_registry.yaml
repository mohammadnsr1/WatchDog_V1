# Model registry for tracked objects that should appear in the MoveIt planning scene.
#
# - tf_frame is the tracked object frame published into TF.
# - lookup_frame is the frame used for MoveIt planning scene poses.
# - pose_offset is T_object_collision, the transform from tracked object frame
#   to the collision geometry frame.
# - The final collision pose is T_lookup_collision = T_lookup_object * T_object_collision.
# - Mesh entries can be added later once scene backend mesh loading is implemented.
#
# spec block (graspable objects only):
#   Represents manufacturing documentation — fixed, authoritative constants.
#   Thresholds here are the SOLE source of truth for contract clauses; never
#   duplicate them as inline constants elsewhere in the code.
#
#   grasp.grasp_center_offset  — T_object_grasp_center (zero for symmetric primitives)
#   grasp.grasp_width_m        — EXPECTED RG2 opening width at contact [m].
#                                This is a verification input for the grasp primitive,
#                                NOT a commanded position. Force control closes until a
#                                plateau; this value is compared against the measured
#                                width at plateau to detect air grasps.
#   grasp.force_threshold_n    — per-object STOP TRIGGER for the guarded close [sim
#                                effort units]. The guarded close stops once measured
#                                finger_joint effort FIRST CROSSES this value — it is
#                                not a steady-state force setpoint or a ceiling and it
#                                does NOT bound the settled clamp effort. It must sit
#                                below the achievable effort ceiling for the configured
#                                clearance (see the ceiling-law comment below) or the
#                                close stalls before reaching it and stops instead with
#                                stop_reason="effort_plateau". At the current 3 mm
#                                clearance the trigger is nearly inert in practice —
#                                debounce and stiffness lag carry the close to the floor
#                                regardless of where this is set (measured: thresholds
#                                0.5 / 1.0 / 2.0 all settle at 3.38-3.42 effort units).
#                                This is an engineering parameter of the close
#                                procedure, not manufacturing documentation about the
#                                object — it does NOT belong in a conformance clause.
#                                NOTE: in Isaac Sim the effort scale is small (~0.48 for
#                                a solid rigid grasp). These values are in sim effort
#                                units, not physical Newtons. Force control is therefore
#                                approximate in sim; real-hardware deployments should
#                                re-characterise and update these thresholds.
#   tolerances.position_m      — allowable object pose MEASUREMENT error before /
#                                after pick [m]. Not a bound on permitted physical
#                                displacement -- see disturbance_tolerance_m below.
#   tolerances.orientation_deg — allowable orientation error [degrees]
#   tolerances.lift_height_min_m — minimum vertical displacement to confirm grasp [m]
#   tolerances.disturbance_tolerance_m — max permitted physical displacement for an
#                                object a clause requires to stay undisturbed [m].
#                                Source for stationarity's epsilon_m. Distinct from
#                                position_m even where the values coincide: position_m
#                                is about measurement tolerance on a still object,
#                                this is about how far a still object is allowed to
#                                actually move.
#   limits.max_clamp_effort    — CONFORMANCE BOUND: the maximum clamp effort the object
#                                tolerates [sim effort units] — manufacturing
#                                documentation, not an engineering parameter of the
#                                close procedure. Unlike the removed max_contact_force_n
#                                (which was in Newtons with no sensor feed), this is
#                                directly measurable from finger_joint effort and can be
#                                monitored. Distinct in kind from force_threshold_n: the
#                                trigger says when to stop closing, the bound says what
#                                the object can survive. Raising force_threshold_n can
#                                never make a grasp satisfy this bound retroactively —
#                                it only commands a harder squeeze.
#
#   Effort ceiling law (instrument characterization, not a task-learned threshold):
#   against a rigid object, position control tracks target_width_m =
#   grasp_width_m - GRASP_CLEARANCE_M, which sits inside the object once contact is
#   made; steady-state tracking error saturates at the clearance, and since
#   torque ~= stiffness x tracking_error, CLEARANCE sets the achievable settled
#   effort ceiling — force_threshold_n can only stop the close early, never push
#   past it. Measured on green_cube (clearance x settled effort, from
#   test/rg2_effort_sweep.py's effort_plateau cells): 1 mm -> 0.944, 2 mm -> 2.150,
#   3 mm -> 3.425, 4 mm -> 4.41, 5 mm -> 5.54 (~1.15 effort-units per mm). At
#   GRASP_CLEARANCE_M = 3 mm the measured ceiling (~3.43) sits ~15% under
#   max_clamp_effort = 4.0 — that margin is WHY 3 mm was chosen; 4 mm and 5 mm
#   clearances measure above the bound and would violate it on every grasp.

# cell: properties of the cell itself (robot + gripper), not of any one
# tracked object -- the joint and frame names monitor primitives need but
# that used to exist only inside English clause descriptions or nowhere at
# all. Extracted from the expanded URDF at
# ros2_ws/src/robot_description/urdf/ur5e_ros.urdf and cross-checked against
# ros2_ws/src/isaac_trajectory_bridge/isaac_trajectory_bridge/rg2_controller.py
# (DEFAULT_MASTER_JOINT_NAME) and ros2_ws/src/ur5e_moveit_config/config/ur5e.srdf
# (virtual_joint world_joint's parent_frame). See get_contract, which surfaces
# this section verbatim so monitor parameters are read, never guessed.
cell:
  gripper:
    effort_joint_name: finger_joint   # the RG2's single actuated joint; all
                                       # other finger joints mimic it, so this
                                       # is the only one whose effort on
                                       # /joint_states means anything as a
                                       # clamp-force measurement.
    tcp_frame: tcp                    # fixed tool-centre-point frame, joined
                                       # to wrist_3_link by a fixed joint.
    # No grasp-centre TF frame exists. The grasp centre is computed from
    # commanded grasp width via the RG2 calibration table (see
    # robot_backend.utils.rg2_geometry); it is not published to TF. Any
    # monitor needing a gripper-side frame uses tcp_frame above.
  base_frame: world                   # MoveIt's planning/fixed frame --
                                       # ur5e.srdf's virtual_joint world_joint
                                       # parents base_link to "world".

# MoveIt Allowed Collision Matrix entries. Each pair disables collision checking
# between two OBJECTS so that intended contact (stacking, insertion) does not
# leave the planning scene permanently in collision and block subsequent motion.
#
# This is a planner tractability setting. It carries no task-level permission and
# says nothing about which objects the robot may touch. Contact between the robot
# and an object that the specification requires to stay undisturbed is a
# conformance violation, detected by the supervisory monitor from physical
# evidence, and is deliberately not prevented by the planner.
acm_allowed_object_pairs:
  - [green_cube, red_cube]

objects:
  red_cube:
    enabled: true
    object_id: red_cube
    tf_frame: red_cube
    lookup_frame: world
    class_name: cube
    source: isaac_gt
    graspable: true
    collision:
      type: box
      dimensions: [0.06, 0.06, 0.06]
      pose_offset:
        position: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    spec:
      grasp:
        grasp_center_offset:
          position: {x: 0.0, y: 0.0, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
        grasp_width_m: 0.06      # expected contact width [m]; verification input, not a command
        force_threshold_n: 2.0   # stop trigger; below the ~3.43 ceiling at 3 mm clearance
      tolerances:
        position_m: 0.005         # 5 mm pre-pick localization tolerance
        orientation_deg: 5.0      # 5 degree heading tolerance
        lift_height_min_m: 0.02   # 20 mm minimum lift for positive grasp confirmation
        disturbance_tolerance_m: 0.005   # max displacement for stationarity when this
                                          # object is required to stay undisturbed --
                                          # a distinct quantity from position_m above
                                          # even though it happens to share the same
                                          # value here: position_m bounds pose
                                          # MEASUREMENT error before a pick, this
                                          # bounds permitted physical DISPLACEMENT of
                                          # an object nothing should be touching.
        grasp_width_tolerance_m: 0.005   # plausibility band the executor checks measured
                                          # grip width against at plateau; fixed across
                                          # clean and fault-injected runs -- the fault
                                          # perturbs grasp geometry, never this band.
      limits:
        max_clamp_effort: 4.0     # conformance bound: max clamp effort this object tolerates
        grasp_effort_floor: 0.05  # instrument characterization constant: empirical RG2
                                   # air-close floor in Isaac Sim, above the ~0.03 idle
                                   # noise floor.

  green_cube:
    enabled: true
    object_id: green_cube
    tf_frame: green_cube
    lookup_frame: world
    class_name: cube
    source: isaac_gt
    graspable: true
    collision:
      type: box
      dimensions: [0.04, 0.04, 0.04]
      pose_offset:
        position: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    spec:
      grasp:
        grasp_center_offset:
          position: {x: 0.0, y: 0.0, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
        grasp_width_m: 0.04      # expected contact width [m]; verification input, not a command
        force_threshold_n: 2.0   # stop trigger; below the ~3.43 ceiling at 3 mm clearance
      tolerances:
        position_m: 0.005         # 5 mm pre-pick localization tolerance
        orientation_deg: 5.0      # 5 degree heading tolerance
        lift_height_min_m: 0.02   # 20 mm minimum lift for positive grasp confirmation
        disturbance_tolerance_m: 0.005   # max displacement for stationarity when this
                                          # object is required to stay undisturbed --
                                          # a distinct quantity from position_m above
                                          # even though it happens to share the same
                                          # value here: position_m bounds pose
                                          # MEASUREMENT error before a pick, this
                                          # bounds permitted physical DISPLACEMENT of
                                          # an object nothing should be touching.
        grasp_width_tolerance_m: 0.005   # plausibility band the executor checks measured
                                          # grip width against at plateau; fixed across
                                          # clean and fault-injected runs -- the fault
                                          # perturbs grasp geometry, never this band.
      limits:
        max_clamp_effort: 4.0     # conformance bound: max clamp effort this object tolerates
        grasp_effort_floor: 0.05  # instrument characterization constant: empirical RG2
                                   # air-close floor in Isaac Sim, above the ~0.03 idle
                                   # noise floor.

  # FMB mesh object for the Phase 1 (M1-M4) validation ladder. Folded in from
  # model_registry_mesh_example.yaml so the whole ladder sees one registry.
  # mesh collision requires an explicitly authored pose_offset (identity here).
  u_green:
    enabled: true
    object_id: u_green
    tf_frame: u_green
    lookup_frame: world
    class_name: fmb_u
    source: isaac_gt
    graspable: true
    collision:
      type: mesh
      mesh_path: assets/fmb_u_green.obj   # relative to asset_root (defaults to config/)
      scale: [1.0, 1.0, 1.0]
      pose_offset:
        position: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    spec:
      grasp:
        # T_object_grasp_center for a top-down grasp on the U's RIGHT arm.
        # Derived from the mesh (config/assets/fmb_u_green.obj):
        #   right arm occupies X in [0.014, 0.035] (thickness 0.021 m = the
        #   jaw-closing dimension), free/graspable over the slot region
        #   Y in [-0.0355, -0.004]; part is 0.021 m tall in Z, TF at part centre.
        # position: centre of the right arm's free region -> X=(0.014+0.035)/2,
        #   Y=mid of [-0.0355,-0.004], Z=0 (mid-height).
        # orientation: 180 deg about (1,1,0)/sqrt(2) -> approach along object -Z
        #   (top-down) with the RG2 jaw axis (grasp-centre +Y, fingers separate
        #   along Y per the URDF) aligned to object +X, so the jaws straddle the
        #   0.021 m arm thickness. tcp_to_grasp_center is identity, so grasp-
        #   centre axes are the tcp axes. (Live jaw sense confirmed in M3.)
        grasp_center_offset:
          position: {x: 0.0245, y: -0.020, z: 0.0}
          orientation: {x: 0.7071067811865476, y: 0.7071067811865476, z: 0.0, w: 0.0}
        grasp_width_m: 0.021    # measured right-arm thickness (jaw-closing dimension)
        force_threshold_n: 2.0
      tolerances:
        position_m: 0.005
        orientation_deg: 5.0
        lift_height_min_m: 0.02
        disturbance_tolerance_m: 0.005
        grasp_width_tolerance_m: 0.005
      limits:
        max_clamp_effort: 4.0
        grasp_effort_floor: 0.05
