# Model registry for tracked objects that should appear in the MoveIt planning scene.
#
# - tf_frame is the tracked object frame published into TF.
# - lookup_frame is the frame used for MoveIt planning scene poses.
# - pose_offset is T_object_collision, the transform from tracked object frame
#   to the collision geometry frame.
# - The final collision pose is T_lookup_collision = T_lookup_object * T_object_collision.
# - Mesh entries can be added later once scene backend mesh loading is implemented.
#
# spec block (graspable objects only):
#   Represents manufacturing documentation — fixed, authoritative constants.
#   Thresholds here are the SOLE source of truth for contract clauses; never
#   duplicate them as inline constants elsewhere in the code.
#
#   grasp.grasp_center_offset  — T_object_grasp_center (zero for symmetric primitives)
#   grasp.grasp_width_m        — EXPECTED RG2 opening width at contact [m].
#                                This is a verification input for the grasp primitive,
#                                NOT a commanded position. Force control closes until a
#                                plateau; this value is compared against the measured
#                                width at plateau to detect air grasps.
#   grasp.force_threshold_n    — per-object STOP TRIGGER for the guarded close [sim
#                                effort units]. The guarded close stops once measured
#                                finger_joint effort FIRST CROSSES this value — it is
#                                not a steady-state force setpoint or a ceiling. The
#                                settled clamp effort after the stop is a consequence
#                                of penetration depth and joint stiffness and will read
#                                higher than this trigger. Low for delicate objects,
#                                higher for rigid ones.
#                                NOTE: in Isaac Sim the effort scale is small (~0.48 for
#                                a solid rigid grasp). These values are in sim effort
#                                units, not physical Newtons. Force control is therefore
#                                approximate in sim; real-hardware deployments should
#                                re-characterise and update these thresholds.
#   tolerances.position_m      — allowable object pose error before / after pick [m]
#   tolerances.orientation_deg — allowable orientation error [degrees]
#   tolerances.lift_height_min_m — minimum vertical displacement to confirm grasp [m]
#
#   There is no limits.max_contact_force_n field: this platform has no force/torque
#   sensor and no calibration from Isaac sim-effort units to Newtons, so a
#   Newton-valued bound has no feed and cannot be monitored. It does not sit in the
#   spec chain implying it is checkable.

# permitted_contacts: object pairs that are allowed to physically touch
# for the duration of a run (e.g. because the assembly plan requires
# them to be in contact at some point). Declared once here and applied
# to MoveIt's Allowed Collision Matrix at task start — persistent for
# the session, not re-detected per attach/detach. This does NOT mean any
# contact between the pair is automatically conformant: it only
# suppresses the planner's collision block. WatchDog's own contact
# predicates still judge whether a given contact event, at a given step,
# matches what the contract expects.
permitted_contacts:
  - [green_cube, red_cube]

objects:
  red_cube:
    enabled: true
    object_id: red_cube
    tf_frame: red_cube
    lookup_frame: world
    class_name: cube
    source: isaac_gt
    graspable: true
    collision:
      type: box
      dimensions: [0.06, 0.06, 0.06]
      pose_offset:
        position: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    spec:
      grasp:
        grasp_center_offset:
          position: {x: 0.0, y: 0.0, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
        grasp_width_m: 0.06      # expected contact width [m]; verification input, not a command
        force_threshold_n: 0.5   # effort cap: solid 6 cm cube; above the ~0.48 sim plateau
      tolerances:
        position_m: 0.005         # 5 mm pre-pick localization tolerance
        orientation_deg: 5.0      # 5 degree heading tolerance
        lift_height_min_m: 0.02   # 20 mm minimum lift for positive grasp confirmation

  green_cube:
    enabled: true
    object_id: green_cube
    tf_frame: green_cube
    lookup_frame: world
    class_name: cube
    source: isaac_gt
    graspable: true
    collision:
      type: box
      dimensions: [0.04, 0.04, 0.04]
      pose_offset:
        position: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    spec:
      grasp:
        grasp_center_offset:
          position: {x: 0.0, y: 0.0, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
        grasp_width_m: 0.04      # expected contact width [m]; verification input, not a command
        force_threshold_n: 4.0  # effort cap: smaller 4 cm cube; slightly below the rigid plateau
      tolerances:
        position_m: 0.005         # 5 mm pre-pick localization tolerance
        orientation_deg: 5.0      # 5 degree heading tolerance
        lift_height_min_m: 0.02   # 20 mm minimum lift for positive grasp confirmation
