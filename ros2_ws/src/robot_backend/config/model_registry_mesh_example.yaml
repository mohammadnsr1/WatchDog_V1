# FMB mesh example for the Phase 1 validation ladder.
# Pass this path as model_registry_path when running the M1-M4 live checks.
objects:
  u_green:
    enabled: true
    object_id: u_green
    tf_frame: u_green
    lookup_frame: world
    class_name: fmb_u
    source: isaac_gt
    graspable: true
    collision:
      type: mesh
      mesh_path: assets/fmb_u_green.obj
      scale: [1.0, 1.0, 1.0]
      pose_offset:
        position: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    spec:
      grasp:
        force_threshold_n: 2.0
      tolerances:
        position_m: 0.005
        orientation_deg: 5.0
        lift_height_min_m: 0.02
        disturbance_tolerance_m: 0.005
        grasp_width_tolerance_m: 0.005
      limits:
        max_clamp_effort: 4.0
        grasp_effort_floor: 0.05
