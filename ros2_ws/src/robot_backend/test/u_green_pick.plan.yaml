# Example plan for plan_assembly_step.py -- u_green pick, reorient, place.
# See plan_assembly_step.py's own docstring for the plan file format,
# available actions, and the frame: options on move_grasp_center_to_pose.

object_id: u_green
gripper_width_m: 0.042

steps:
  - step_id: sync_scene
    action: sync_scene

    object_ids: [u_green, base2, hex_blue, hex_red, inverted_u_brown]

  - step_id: set_permitted_contacts
    action: set_permitted_contacts


  - step_id: safe_start
    action: move_named_safe_pose
    name: ready

  - step_id: pick_u_green
    action: approach_and_preposition
    approach_distance_m: -0.10
    grasp_center_offset:
      position: {x: 0.05, y: -0.050, z: 0.0}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}
    stop_at_pregrasp: false

  - step_id: grasp_u_green
    action: grasp

  - step_id: lift_u_green
    action: move_grasp_center_to_pose
    frame: delta_from_last
    delta: {x: 0.0, y: 0.0, z: 0.3}


  - step_id: reorient_u_green
    action: move_grasp_center_to_pose
    frame: target_object
    target_id: u_green_reorient
    target_offset:
      position: {x: 0.0, y: -0.01000, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_center_offset:
      position: {x: 0.05, y: -0.050, z: 0.0}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}

  - step_id: release_u_green
    action: release


  - step_id: repick_u_green
    action: approach_and_preposition

    approach_distance_m: -0.10
    grasp_center_offset:
      position: {x: 0.05, y: -0.050, z: 0.0}
      orientation: {x: -0.7071, y: 0.0, z: 0.0, w: 0.7071}
    stop_at_pregrasp: false

  - step_id: regrasp_u_green
    action: grasp

  # The part stood upright here while unattached, so the octomap holds its own
  # voxels; attaching does not clear them and the lift then starts "in
  # collision" with them. Drop them before moving.
  - step_id: clear_octomap_after_regrasp
    action: clear_octomap

  - step_id: lift_u_green_second
    action: move_grasp_center_to_pose
    frame: delta_from_last
    delta: {x: 0.0, y: 0.0, z: 0.2}

  - step_id: placement_approach
    action: move_grasp_center_to_pose

    frame: target_object
    target_id: u_green_placement
    target_offset:
      position: {x: 0.0, y: -0.15, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_center_offset:
      position: {x: 0.05, y: -0.050, z: 0.0}
      orientation: {x: -0.7071, y: 0.0, z: 0.0, w: 0.7071}

    motion:
      solve_ik_first: true
      joint_tolerance: 0.0001
      max_velocity_scaling_factor: 0.2
      max_acceleration_scaling_factor: 0.2
      allowed_planning_time: 20.0

  - step_id: placement
    action: move_grasp_center_to_pose
    frame: target_object
    target_id: u_green_placement
    grasp_center_offset:
      position: {x: 0.05, y: -0.050, z: 0.0}
      orientation: {x: -0.7071, y: 0.0, z: 0.0, w: 0.7071}
    motion:
      solve_ik_first: true
      joint_tolerance: 0.0001
      max_velocity_scaling_factor: 0.1
      max_acceleration_scaling_factor: 0.1
      allowed_planning_time: 20.0

  - step_id: release_u_green_final
    action: release

  - step_id: retreat_after_placement
    action: retreat
    distance_m: -0.10
