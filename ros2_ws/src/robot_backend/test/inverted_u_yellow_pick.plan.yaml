# Plan for plan_assembly_step.py -- inverted_u_yellow pick, place. Mirrors
# fmb_assembly_2 task file's pick_inverted_u_yellow /
# place_approach_inverted_u_yellow / place_inverted_u_yellow steps exactly.
# No reorient span in the finalized plan, unlike inverted_u_brown in the
# fmb2 set.

object_id: inverted_u_yellow
gripper_width_m: 0.04

steps:
  - step_id: sync_scene
    action: sync_scene
    object_ids: [u_brown, u_orange, line_green, inverted_u_yellow, base1]

  - step_id: set_permitted_contacts
    action: set_permitted_contacts

  - step_id: safe_start
    action: move_named_safe_pose
    name: ready

  - step_id: pick_inverted_u_yellow
    action: approach_and_preposition
    approach_distance_m: -0.1
    grasp_center_offset:
      position: {x: 0.0, y: -0.02, z: 0.0}
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}
    stop_at_pregrasp: false

  - step_id: grasp_inverted_u_yellow
    action: grasp

  - step_id: lift_inverted_u_yellow
    action: move_grasp_center_to_pose
    frame: delta_from_last
    delta: {x: 0.0, y: 0.0, z: 0.3}

  - step_id: clear_octomap_after_grasp
    action: clear_octomap

  - step_id: set_permitted_contacts_after_grasp
    action: set_permitted_contacts

  - step_id: place_approach_inverted_u_yellow
    action: move_grasp_center_to_pose
    frame: target_object
    target_id: inverted_u_yellow_placement
    target_offset:
      position: {x: 0.0, y: -0.12, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_center_offset:
      position: {x: 0.0, y: -0.02, z: 0.0}
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}

  - step_id: clear_octomap_before_placement
    action: clear_octomap

  - step_id: place_inverted_u_yellow
    action: move_grasp_center_to_pose
    frame: target_object
    target_id: inverted_u_yellow_placement
    grasp_center_offset:
      position: {x: 0.0, y: -0.02, z: 0.0}
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}
    motion:
      max_velocity_scaling_factor: 0.1
      max_acceleration_scaling_factor: 0.1
      allowed_planning_time: 20.0

  - step_id: release_inverted_u_yellow
    action: release

  - step_id: retreat_after_placement
    action: retreat
    distance_m: -0.10
