# Plan for plan_assembly_step.py -- inverted_u_brown pick and place.
# Same structure as u_green_pick.plan.yaml; see plan_assembly_step.py's
# docstring for the format and the frame: options.
#
# UNVERIFIED VALUES are marked TODO below. Mesh bounds for this part are
# 0.252 (X) x 0.140 (Y) x 0.042 (Z) -- same thickness/depth as u_green, but
# 1.8x longer in X, so u_green's grasp point does NOT carry over.

object_id: inverted_u_brown
gripper_width_m: 0.08        # TODO verify -- matches the 42mm Z thickness,
                              # same as u_green, but confirm against the
                              # actual grasp feature on this part.

steps:
  - step_id: sync_scene
    action: sync_scene
    object_ids: [u_green, base2, hex_blue, hex_red, inverted_u_brown]

  - step_id: set_permitted_contacts
    action: set_permitted_contacts

  - step_id: safe_start
    action: move_named_safe_pose
    name: ready

  - step_id: pick_inverted_u_brown
    action: approach_and_preposition
    # Top-down TCP: local +Z points down into the object, so the approach
    # distance is negative to back up off the table.
    approach_distance_m: -0.10
    grasp_center_offset:
      position: {x: 0.0, y: -0.05, z: 0.0}         
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}  
    stop_at_pregrasp: false

  - step_id: grasp_inverted_u_brown
    action: grasp

  - step_id: lift_inverted_u_brown
    action: move_grasp_center_to_pose
    frame: delta_from_last
    delta: {x: 0.0, y: 0.0, z: 0.3}
 

    
  - step_id: reorient_u_inverted_u_brown
    action: move_grasp_center_to_pose

    frame: target_object
    object_pose:
      position: {x: 0.0, y: -0.2, z: 0.085}
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}   # -90 deg about X (upright)
    grasp_center_offset:
      position: {x: 0.0, y: -0.05, z: 0.0} 
      orientation: {x: -0.7071, y: 0.0, z: 0.0, w: -0.7071}




  - step_id: release_inverted_u_brown
    action: release
  - step_id: clear_octomap_after_regrasp
    action: clear_octomap
    
  - step_id: reorient for repick
    action: approach_and_preposition
    # Top-down TCP: local +Z points down into the object, so the approach
    # distance is negative to back up off the table.
    approach_distance_m: -0.10
    grasp_center_offset:
      position: {x: 0.0, y: -0.06, z: 0.0}         
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}  
    stop_at_pregrasp: false


  - step_id: regrasp_inverted_u_brown
    action: grasp

  # The part stood 140mm tall here while unattached, so the octomap holds its
  # own voxels; attaching does not clear them and the lift then starts "in
  # collision" with them. Drop them before moving.
  - step_id: clear_octomap_after_regrasp
    action: clear_octomap

  - step_id: lift_inverted_u_brown_second
    action: move_grasp_center_to_pose
    frame: delta_from_last
    delta: {x: 0.0, y: 0.0, z: 0.2}


  - step_id: placement_approach
    action: move_grasp_center_to_pose
    frame: target_object
    # object_pose is the DESIRED world pose of the part. Because the part is
    # attached here, object_pose and grasp_center_offset orientations are not
    # independently choosable -- the object->gripper transform is fixed at
    # grasp time. Dry-run first and check the reported grasp_center.
    object_pose:
      position: {x: 0.48911, y: -0.16234, z: 0.31693}        
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}  
    grasp_center_offset:
      position: {x: 0.0, y: -0.06, z: 0.0}          
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}
    motion:
      solve_ik_first: true
      joint_tolerance: 0.0005
      max_velocity_scaling_factor: 0.2
      max_acceleration_scaling_factor: 0.2
      allowed_planning_time: 20.0

  - step_id: placement
    action: move_grasp_center_to_pose
    frame: target_object
    object_pose:
      position: {x: 0.48911, y: -0.16234, z: 0.11693}        
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}  
    grasp_center_offset:
      position: {x: 0.0, y: -0.06, z: 0.0}          
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}
    motion:
      solve_ik_first: true
      joint_tolerance: 0.0005
      max_velocity_scaling_factor: 0.1
      max_acceleration_scaling_factor: 0.1
      allowed_planning_time: 20.0

  - step_id: release_inverted_u_brown
    action: release
