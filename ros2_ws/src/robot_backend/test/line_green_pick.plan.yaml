# Plan for plan_assembly_step.py -- line_green pick, place. Mirrors
# fmb_assembly_2 task file's pick_line_green / place_approach_line_green /
# place_line_green steps exactly. NOTE the grasp orientation differs between
# pick ({1,0,0,0}, top-down) and place ({0.7071,0,0,-0.7071}) -- copied
# verbatim from the task file, not a transcription slip.

object_id: line_green
gripper_width_m: 0.03

steps:
  - step_id: sync_scene
    action: sync_scene
    object_ids: [u_brown, u_orange, line_green, inverted_u_yellow, base1]

  - step_id: set_permitted_contacts
    action: set_permitted_contacts

  - step_id: safe_start
    action: move_named_safe_pose
    name: ready

  - step_id: pick_line_green
    action: approach_and_preposition
    approach_distance_m: -0.1
    grasp_center_offset:
      position: {x: 0.0, y: 0.0, z: 0.01}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}
    stop_at_pregrasp: false

  - step_id: grasp_line_green
    action: grasp

  - step_id: lift_line_green
    action: move_grasp_center_to_pose
    frame: delta_from_last
    delta: {x: 0.0, y: 0.0, z: 0.3}

  - step_id: clear_octomap_after_grasp
    action: clear_octomap

  - step_id: set_permitted_contacts_after_grasp
    action: set_permitted_contacts

  - step_id: place_approach_line_green
    action: move_grasp_center_to_pose
    frame: target_object
    target_id: line_green_placement
    target_offset:
      position: {x: -0.001, y: -0.001, z: 0.1}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_center_offset:
      position: {x: 0.0, y: 0.0, z: 0.01}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}

  - step_id: clear_octomap_before_placement
    action: clear_octomap

  - step_id: place_line_green
    action: move_grasp_center_to_pose
    frame: target_object
    target_id: line_green_placement
    grasp_center_offset:
      position: {x: 0.0, y: 0.0, z: 0.01}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}
    motion:
      max_velocity_scaling_factor: 0.05
      max_acceleration_scaling_factor: 0.05
      allowed_planning_time: 20.0
      position_tolerance_m: 0.0001
      orientation_tolerance_rad: 0.05

  - step_id: release_line_green
    action: release

  - step_id: retreat_after_placement
    action: retreat
    distance_m: -0.10
