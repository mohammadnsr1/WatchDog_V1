# Plan for plan_assembly_step.py -- u_brown pick, place. Mirrors fmb_assembly_2
# task file's pick_u_brown / place_approach_u_brown / place_u_brown steps
# exactly; every geometric value below is copied from
# agents/tasks/fmb_assembly_2.executor.yaml, not re-derived.
#
# No reorient span: unlike u_green in the fmb2 set, u_brown is picked once and
# carried straight to its placement.

object_id: u_brown
gripper_width_m: 0.02

steps:
  - step_id: sync_scene
    action: sync_scene
    object_ids: [u_brown, u_orange, line_green, inverted_u_yellow, base1]

  - step_id: set_permitted_contacts
    action: set_permitted_contacts

  - step_id: safe_start
    action: move_named_safe_pose
    name: ready

  - step_id: pick_u_brown
    action: approach_and_preposition
    approach_distance_m: -0.1
    grasp_center_offset:
      position: {x: 0.025, y: -0.03, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}
    stop_at_pregrasp: false

  - step_id: grasp_u_brown
    action: grasp

  # lift_height_m from the task file is a WORLD-frame height, same as
  # delta_from_last's world-frame semantics -- see the task file's own
  # lift_note.
  - step_id: lift_u_brown
    action: move_grasp_center_to_pose
    frame: delta_from_last
    delta: {x: 0.0, y: 0.0, z: 0.2}

  - step_id: clear_octomap_after_grasp
    action: clear_octomap

  - step_id: set_permitted_contacts_after_grasp
    action: set_permitted_contacts

  - step_id: place_approach_u_brown
    action: move_grasp_center_to_pose
    frame: target_object
    target_id: u_brown_placement
    target_offset:
      position: {x: 0.0, y: -0.1, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_center_offset:
      position: {x: 0.025, y: -0.03, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}

  - step_id: clear_octomap_before_placement
    action: clear_octomap

  - step_id: place_u_brown
    action: move_grasp_center_to_pose
    frame: target_object
    target_id: u_brown_placement
    grasp_center_offset:
      position: {x: 0.025, y: -0.03, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}
    motion:
      max_velocity_scaling_factor: 0.1
      max_acceleration_scaling_factor: 0.1
      allowed_planning_time: 20.0

  - step_id: release_u_brown
    action: release

  - step_id: retreat_after_placement
    action: retreat
    distance_m: -0.10
