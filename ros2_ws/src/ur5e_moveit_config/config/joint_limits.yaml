# These values mirror the current URDF limits from robot_description.
# Acceleration limits are conservative placeholders for planning and can be refined later.

default_robot_padding: 0.0
default_robot_scale: 1.0
link_padding:
  onrobot_rg2_left_inner_finger: 0.0
  onrobot_rg2_right_inner_finger: 0.0
  onrobot_rg2_left_inner_knuckle: 0.0
  onrobot_rg2_right_inner_knuckle: 0.0
  onrobot_rg2_left_outer_knuckle: 0.0
  onrobot_rg2_right_outer_knuckle: 0.0

joint_limits:
  shoulder_pan_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  elbow_joint:
    has_position_limits: true
    # ELBOW-UP ONLY. A negative elbow is what let MoveIt reach the parts by
    # swinging upper_arm_link through the Vention frame -- the frame is not in
    # the planning scene (only the flat workspace_floor slab, top z=-0.05), so
    # nothing else forbids it. Isaac then had to resolve the interpenetration:
    # RTF collapsed 0.95 -> 0.19 and the goal died GOAL_TOLERANCE_VIOLATED.
    # Seeding IK from an elbow-up state does NOT hold -- KDL is numerical and
    # jumped to elbow=-82 deg anyway. A bound does hold: MoveIt applies these
    # to the JointModel, so KDL's search and OMPL's sampling both respect it.
    # 0.0 (fully straight) stays legal because the far parts need the reach.
    min_position: 0.0
    max_position: 3.141592653589793
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  wrist_1_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  wrist_2_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  wrist_3_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  finger_joint:
    has_position_limits: true
    min_position: -0.558505
    max_position: 0.785398
    has_velocity_limits: true
    max_velocity: 100.0
    has_acceleration_limits: true
    max_acceleration: 3.0

