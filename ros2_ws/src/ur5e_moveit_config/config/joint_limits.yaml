# These values mirror the current URDF limits from robot_description.
# Acceleration limits are conservative placeholders for planning and can be refined later.

default_robot_padding: 0.0
default_robot_scale: 1.0
link_padding:
  onrobot_rg2_left_inner_finger: 0.0
  onrobot_rg2_right_inner_finger: 0.0
  onrobot_rg2_left_inner_knuckle: 0.0
  onrobot_rg2_right_inner_knuckle: 0.0
  onrobot_rg2_left_outer_knuckle: 0.0
  onrobot_rg2_right_outer_knuckle: 0.0

joint_limits:
  # +-180 deg instead of +-360. At +-360 every joint has a 720 deg span, so each
  # pose has several IK solutions differing by whole revolutions. KDL returned
  # ones in extreme branches (placement_approach: wrist_3=353.6 deg, 0.1 rad off
  # the stop; brown pick: shoulder_lift=313.5 deg) and OMPL then had to cross most
  # of a revolution on several joints at once -- start and goal both verified
  # collision-free, yet all 3 planners found no path. Halving each span removes the
  # duplicate branches and keeps every physically distinct pose reachable.
  shoulder_pan_joint:
    has_position_limits: true
    min_position: -3.141592653589793
    max_position: 3.141592653589793
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  # shoulder_lift stays at +-360; only shoulder_pan is clamped. Measured: sweeping
  # the grasp orientation from top-down toward hex_blue's side grasp, IK holds to
  # t=0.6 where the solution sits at shoulder_lift=+168.1 deg -- hard against a +-180
  # clamp -- and returns NO_IK from t=0.7 on. Clamping this joint is what made that
  # side grasp unreachable. Wrapping here is tolerable: it pitches the arm rather
  # than sweeping it around the base the way a wrapped shoulder_pan does.
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  elbow_joint:
    has_position_limits: true
    # ELBOW-UP ONLY. A negative elbow is what let MoveIt reach the parts by
    # swinging upper_arm_link through the Vention frame -- the frame is not in
    # the planning scene (only the flat workspace_floor slab, top z=-0.05), so
    # nothing else forbids it. Isaac then had to resolve the interpenetration:
    # RTF collapsed 0.95 -> 0.19 and the goal died GOAL_TOLERANCE_VIOLATED.
    # Seeding IK from an elbow-up state does NOT hold -- KDL is numerical and
    # jumped to elbow=-82 deg anyway. A bound does hold: MoveIt applies these
    # to the JointModel, so KDL's search and OMPL's sampling both respect it.
    # 0.0 (fully straight) stays legal because the far parts need the reach.
    min_position: 0.0
    max_position: 3.141592653589793
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  # WRISTS stay at +-360 while the shoulders are clamped to +-180. The wrapping
  # that defeated OMPL was in the SHOULDERS: a wrapped shoulder_pan/lift swings the
  # whole arm through a huge arc, so the planner must cross most of a revolution of
  # real motion. A wrapped wrist only spins the tool in place -- cheap to plan, and
  # REQUIRED here: clamping the wrists to +-180 left hex_blue's side grasp with no
  # IK solution at ANY distance (0.67-0.84 m all NO_IK), while the same position
  # top-down solved fine. Orientation, not reach, was the binding constraint.
  wrist_1_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  wrist_2_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  wrist_3_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 3.0
  finger_joint:
    has_position_limits: true
    min_position: -0.558505
    max_position: 0.785398
    has_velocity_limits: true
    max_velocity: 100.0
    has_acceleration_limits: true
    max_acceleration: 3.0

