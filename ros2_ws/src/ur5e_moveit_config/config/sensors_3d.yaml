# MoveIt 3D perception configuration for occupancy-map updates from Isaac.
# sim_moveit_bringup can override the point cloud topic and update rate dynamically.
# TF must connect the cloud frame to the MoveIt planning frame for updates to work.

octomap_frame: world
octomap_resolution: 0.05
sensors:
  - isaac_point_cloud

isaac_point_cloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  # /camera/depth/points_filtered is pre-MoveIt workspace filtered and may still include robot points.
  point_cloud_topic: /camera/depth/points_filtered
  max_range: 2.0
  point_subsample: 1
  padding_offset: 0.06
  padding_scale: 1.0
  max_update_rate: 2.0
  # /moveit/filtered_cloud is the MoveIt robot-self-filtered diagnostic output.
  filtered_cloud_topic: /moveit/filtered_cloud
