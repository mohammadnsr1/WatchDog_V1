# MoveIt 3D perception configuration for occupancy-map updates from Isaac.
# sim_moveit_bringup can override the point cloud topic and update rate dynamically.
# TF must connect the cloud frame to the MoveIt planning frame for updates to work.
# The MoveIt octomap updater expects time-consistent point clouds; do not restamp old sensor data as now.

octomap_frame: world
# Standalone default; sim_moveit_bringup overrides it. Keep the two in step --
# see sim_moveit_bringup's octomap_resolution argument for why 0.025, not 0.01.
# This whole file is only loaded when move_group is launched with
# use_octomap:=true, which is no longer the bringup default.
octomap_resolution: 0.025
sensors:
  - isaac_point_cloud

isaac_point_cloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  # /camera/depth/points_filtered is pre-MoveIt workspace filtered and may still include robot points.
  point_cloud_topic: /camera/depth/points_filtered
  max_range: 2.0
  point_subsample: 1
  # More aggressive self-filter padding to suppress robot leakage from the camera view.
  padding_offset: 0.14
  padding_scale: 1.20
  max_update_rate: 10.0   # overridden by sim_moveit_bringup's pointcloud_filter_rate launch arg when launched that way; kept in sync as the standalone default.
  # /moveit/filtered_cloud is the MoveIt robot-self-filtered diagnostic output.
  filtered_cloud_topic: /moveit/filtered_cloud
