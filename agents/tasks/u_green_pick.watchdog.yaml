# WATCHDOG instruction for u_green_pick.
#
# Contains only WHAT must be true (effects + invariants), never the executor's
# path. The executor may reach the end-state by any route; the watchdog
# verdicts on the end-state and the invariants, not on how the executor got
# there. No preconditions are checked for this task.
#
# Object-level truth lives in model_registry.yaml, shared by both files.

name: u_green_pick
instruction_spec: |
  Verify that u_green is picked up and held 5 cm above its starting location.

  Effects (must hold when the executor closes the step):
    - u_green is grasped: it tracks the gripper (object-to-TCP offset within
      the registry position tolerance) and has lifted at least the registry
      lift_height_min_m.
    - u_green has been raised approximately 5 cm above its starting location
      and held there.

  Invariants (must hold throughout the step):
    - Grasp clamp effort on u_green never exceeds u_green's registry
      max_clamp_effort.

  No preconditions are checked for this step.

step_plan: |
  step_id: pick_u_green
  object_id: u_green
  intent: >
    u_green ends grasped and held ~5 cm above its initial location, tracking
    the gripper, with clamp effort never exceeding its registry bound. The
    executor's route to that end-state is not constrained. If the executor
    runs steps not listed here, treat them as unrecognized: hold the process
    invariants and do not flag the step merely for being unrecognized.

steps:
  - step_id: pick_u_green
    object_id: u_green
    # grasp_width_m is the conformance bound for the grasp_width_error_m effect
    # clause, read structurally by get_contract from THIS file (never from the
    # agent). grasp_center_offset is intentionally absent: it is executor
    # command geometry, not a watchdog conformance value.
    grasp_width_m: 0.042
    # This task authors no preconditions; the contract for this step is
    # effects + invariants only. The loader must honor this (see below).
    contract_clause_groups: [effects, invariants]

object_ids: |
  u_green — FMB assembly part, graspable

run_notes: ""