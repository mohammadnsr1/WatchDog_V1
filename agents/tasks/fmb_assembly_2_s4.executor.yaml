# S4 variant: executor task plus the WatchDog's stated requirements, verbatim. Derived; see agents/prompts/prompt_variants.py.
# EXECUTOR instruction for fmb_assembly_2.
#

name: fmb_assembly_2
instruction_spec: |
  Assemble the FMB board: seat u_brown, u_orange, line_green and
  inverted_u_yellow into their places on base1, in that order.

  base1 is the fixture and is never picked. Its destinations are published
  as TF frames, queried live rather than hardcoded:
  u_brown_placement, u_orange_placement,
  line_green_placement, inverted_u_yellow_placement.

  Order matters. Each part you seat becomes an obstacle for the ones after it,
  so do not reorder without reason.

  Move to safe joint pose at the beginning of the task.

  Preconditions:
    - All four parts and base1 are present.

  Effects (per part):
    - The part's final pose matches its placement frame within the part's
      registry position and orientation tolerances.
    - The part was grasped securely on the way there: measured width at
      plateau matched the step's grasp_width_m within tolerance; no slippage in hand;
    - Previously seated parts are undisturbed: none has moved beyond its
      registry position tolerance from its pre-step snapshot.

  Invariants:
    - Grasp clamp effort on each part never exceeds that part's registry
      max_clamp_effort.
    - The arm never drives a part into base1 or into an already-seated part
      outside the intended seating contact.
    - Only the parts involved in each step should be manipulated, and touched. the rest of the parts and objects should remain undisturbed. 

  Working notes: none beyond the general rules in your standing instructions.

  Requirements your monitoring covers:

  Effects (must hold when the executor closes each place step):
    - The part is seated at its placement frame, within tolerance.
    - The part was gripped at the width the step calls for and lifted clear
      of where it started.
    - base1 is undisturbed: it is the fixture and is never picked.

    - Missed grasp: a grasp the executor reports as holding the part must
      actually hold it, and must close on that part and not another.

  Invariants (must hold throughout each step):
    - Clamp effort on the part never exceeds what that part tolerates.

    - In-hand slippage: while a part is held, it must not move relative to
      the gripper before it is released.

    - Undisturbed objects: every object a step does not act on must stay
      where it last came to rest until some step acts on it.

      This set's own parts rotate through that cycle, becoming active when a
      step names them and inactive again once their place step closes. The
      OTHER assembly's parts never do: no step here acts on any of them, so
      they are inactive from run start to run end and the requirement stands
      over them continuously. Any movement of one, at any time, is a
      disturbance. They are listed under object_ids as BYSTANDERS.

  Workspace observation: observe and monitor the working area for the whole
  run, not only at step boundaries; its camera images and depth data are
  published. Report any unexpected event: an object present that is not
  listed under object_ids, an object that moves when the robot did not move
  it, or someone or something entering the workspace and later leaving.
  Report each one with what it is (as far as the evidence allows), where it
  is, and when it appeared -- and when it left, if it did. An unexpected
  event is not a violation by itself; it is a violation only if it breaks
  another requirement.

step_plan: |
  Four parts, seated in order. Each is picked once and carried straight to its
  placement -- there is no reorient stage anywhere in this task. Each part ends
  released, verified against its placement frame, with the TCP retreated clear.

steps:
  - step_id: pick_u_brown
    object_id: u_brown
    action_hint: grasp, then lift
    grasp_width_m: 0.02
    approach_distance_m: -0.10
    grasp_center_offset:
      position: {x: 0.025, y: -0.02, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}
    lift_height_m: 0.2

  - step_id: place_approach_u_brown
    object_id: u_brown
    action_hint: approach the placement frame from above, stopping clear of contact
    target_frame: u_brown_placement
    target_offset:
      position: {x: 0.0, y: -0.05, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_width_m: 0.02
    grasp_center_offset:
      position: {x: 0.025, y: -0.02, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}

  - step_id: place_u_brown
    object_id: u_brown
    action_hint: descend into the placement frame, release, retreat
    target_frame: u_brown_placement
    grasp_width_m: 0.02
    # target_offset:
    #   position: {x: 0.02, y: 0.0, z: 0.0}
    #   orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_center_offset:
      position: {x: 0.025, y: -0.02, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}

    motion:
      max_velocity_scaling_factor: 0.1
      max_acceleration_scaling_factor: 0.1
      allowed_planning_time: 20.0

  - step_id: pick_u_orange
    object_id: u_orange
    action_hint: grasp, then lift
    grasp_width_m: 0.02
    approach_distance_m: -0.1
    grasp_center_offset:
      position: {x: 0.025, y: -0.02, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}
    lift_height_m: 0.2

  - step_id: place_approach_u_orange
    object_id: u_orange
    action_hint: approach the placement frame from above, stopping clear of contact
    target_frame: u_orange_placement
    # target_offset:
    #   position: {x: 0.001, y: -0.05, z: 0.0}
    #   orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_width_m: 0.02
    grasp_center_offset:
      position: {x: 0.025, y: -0.02, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}

  - step_id: place_u_orange
    object_id: u_orange
    action_hint: descend into the placement frame, release, retreat
    target_frame: u_orange_placement
    grasp_width_m: 0.02
    # target_offset:
    #   position: {x: 0.001, y: 0.0, z: 0.0}
    #   orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_center_offset:
      position: {x: 0.025, y: -0.02, z: 0.0}
      orientation: {x: -0.5, y: -0.5, z: -0.5, w: 0.5}

    motion:
      max_velocity_scaling_factor: 0.05
      max_acceleration_scaling_factor: 0.05
      allowed_planning_time: 20.0
      position_tolerance_m: 0.0001
      orientation_tolerance_rad: 0.001

  # ---- line_green: single pick, direct insertion -----------------------------
  - step_id: pick_line_green
    object_id: line_green
    action_hint: grasp, then lift
    grasp_width_m: 0.03
    approach_distance_m: -0.1
    grasp_center_offset:
      position: {x: 0.0, y: 0.0, z: 0.01}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}
    lift_height_m: 0.3

  - step_id: place_approach_line_green
    object_id: line_green
    action_hint: approach the placement frame from above, stopping clear of contact
    target_frame: line_green_placement
    axis_note: target_offset is expressed in the destination frame's OWN axes, not world. Unlike the other three placement frames, this one's local +Z DOES point up, so the vertical standoff is carried on local Z -- that is why this step offsets on z where u_brown, u_orange and inverted_u_yellow offset on y. Do not "correct" it to y for consistency.

    target_offset:
      position: {x: 0.0, y: 0.0, z: 0.06}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_width_m: 0.03
    grasp_center_offset:
      position: {x: 0.0, y: 0.0, z: 0.01}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}

  - step_id: place_line_green
    object_id: line_green
    action_hint: descend into the placement frame, release, retreat
    target_frame: line_green_placement
    grasp_width_m: 0.03
    target_offset:
      position: {x: 0.0, y: 0.0, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_center_offset:
      position: {x: 0.0, y: 0.0, z: 0.01}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}

    motion:
      max_velocity_scaling_factor: 0.05
      max_acceleration_scaling_factor: 0.05
      allowed_planning_time: 20.0
      position_tolerance_m: 0.0001
      orientation_tolerance_rad: 0.001

  - step_id: pick_inverted_u_yellow
    object_id: inverted_u_yellow
    action_hint: grasp, then lift
    grasp_width_m: 0.04
    approach_distance_m: -0.10
    grasp_center_offset:
      position: {x: 0.0, y: -0.02, z: 0.0}
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}
    lift_height_m: 0.3

  - step_id: place_approach_inverted_u_yellow
    object_id: inverted_u_yellow
    action_hint: approach the placement frame from above, stopping clear of contact
    target_frame: inverted_u_yellow_placement
    target_offset:
      position: {x: 0.00, y: -0.1200, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    grasp_width_m: 0.04
    grasp_center_offset:
      position: {x: 0.0, y: -0.02, z: 0.0}
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}

  - step_id: place_inverted_u_yellow
    object_id: inverted_u_yellow
    action_hint: descend into the placement frame, release, retreat
    target_frame: inverted_u_yellow_placement
    grasp_width_m: 0.04
    grasp_center_offset:
      position: {x: 0.0, y: -0.02, z: 0.0}
      orientation: {x: 0.7071, y: 0.0, z: 0.0, w: -0.7071}

    motion:
      max_velocity_scaling_factor: 0.1
      max_acceleration_scaling_factor: 0.1
      allowed_planning_time: 20.0
object_ids: |
  u_brown          — FMB U part, graspable. Seated first. Inserted directly.
  inverted_u_yellow — FMB inverted-U part, graspable. Inserted directly.
  u_orange         — FMB U part, graspable. Inserted directly.
  line_green       — FMB line part, graspable. Inserted directly.
  base1            — the fixture. NOT graspable and never picked; it carries
                     the slots the four parts seat into.

  Placement destinations are published as TF frames and queried like object
  poses: u_brown_placement, inverted_u_yellow_placement, u_orange_placement,
  line_green_placement. They are pose-only markers, not collision geometry, and
  they move with the fixture -- which is why they are queried rather than
  hardcoded. This task uses no reorient frames.

  BYSTANDERS — the other FMB assembly's objects. PRESENT on the table for
  this entire run, but NOT part of this task: never picked, placed or
  otherwise manipulated here, no placement frames, absent from the steps
  block. Do not look for an end-state for them and do not treat their not
  being seated as something missing. Their only requirement is that they
  do not move -- any movement of one, at any time, is a disturbance.

  u_green           — other assembly's part; must not move.
  inverted_u_brown  — other assembly's part; must not move.
  hex_blue          — other assembly's part; must not move.
  hex_red           — other assembly's part; must not move.
  base2             — other assembly's fixture; not used here, must stay put.

  Registry acm_allowed_object_pairs covers every pair among ALL TEN FMB
  objects -- this assembly's five AND the other assembly's five, including
  every cross-assembly pair such as u_brown against u_green, or line_green
  against base2. That is a planner collision-checking setting, not a
  statement of task permission: contact between any of those parts is
  conformant only insofar as the effect clauses above are satisfied.

  The cross-assembly pairs are switched off DELIBERATELY, and you are the
  reason: a collision the planner avoids is a collision nobody measures.

  Be precise about HOW a bystander can actually be disturbed, because there
  are two contact channels and only one of them is open:

    - A CARRIED PART against a bystander -- REAL. That pair is ACM-permitted,
      so the planner will not refuse a path that carries a held part straight
      through a bystander, and no collision is raised when it does. This is
      the channel by which a bystander can physically be shifted, and it is
      the one to expect.

    - The ARM or GRIPPER against a bystander -- DOES NOT OCCUR. The ACM
      exempts object-against-object pairs only; it never exempts the gripper
      or any arm link, and the bystanders are in the planning scene. The
      planner therefore routes the arm around them. Do not watch for a direct
      arm-strike on a bystander and do not reason about one; it cannot
      happen, and looking for it costs attention the real channel needs.

  So a bystander disturbance reaches you as PART-ON-PART contact: something
  held, dragged into something stationary. Nothing upstream guards against
  it -- the planner has been told that contact is allowed -- so the standing
  stationarity requirement is the bystanders' only protection. If a bystander
  moves, that is the violation, and catching it is yours alone.

run_notes: ""
# Stays empty by design, including for fault-injection runs later. The agent
# must never be told the registry is corrupted, or the class-4 result proves
# nothing.
