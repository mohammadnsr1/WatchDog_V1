# WATCHDOG instruction for fmb_assembly.
#
# Contains only WHAT must be true (effects + invariants), never the executor's
# path. The executor may reach the end-state by any route; the watchdog
# verdicts on the end-state and the invariants, not on how the executor got
# there.
#
# Object-level truth lives in model_registry.yaml, shared by both files.

name: fmb_assembly
instruction_spec: |
  Verify that four FMB parts are seated on the base2 fixture: u_green,
  inverted_u_brown, hex_blue and hex_red.

  Each part's required end-state is given by a published TF frame, not by a
  fixed world pose: u_green_placement, inverted_u_brown_placement,
  hex_blue_hole, hex_red_hole. Query the frame to obtain the required pose.
  A destination frame gives the pose the PART must reach, not a gripper pose.

  Effects (must hold when the executor closes each place step):
    - The part is seated at its placement frame, within tolerance.
    - The part was gripped at the width the step calls for and lifted clear
      of where it started.
    - base2 is undisturbed: it is the fixture and is never picked.

    - Missed grasp: a grasp the executor reports as holding the part must
      actually hold it, and must close on that part and not another.

  Invariants (must hold throughout each step):
    - Clamp effort on the part never exceeds what that part tolerates.

    - In-hand slippage: while a part is held, it must not move relative to
      the gripper before it is released.

    - Undisturbed objects: every object a step does not act on must stay
      where it last came to rest until some step acts on it.

  Preconditions: this task has none. Do not look for them and do not treat
  their absence as something missing.

  Note on intermediate handling: u_green and inverted_u_brown cannot be
  picked in their final orientation, so the executor may legitimately set
  either part down partway through and re-pick it. A part resting somewhere
  other than its placement frame partway through the run is therefore NOT by
  itself a violation. Judge each part against its placement frame at the
  point the executor closes that part's place step.

step_plan: |
  Four parts must end seated at their published placement frames, each
  gripped within the effort the part tolerates, without slipping in the
  gripper, and without disturbing any part that is not the one currently
  being worked on, or the base2 fixture.

  The parts are worked one at a time, in this order:

    1. u_green           -> u_green_placement
    2. inverted_u_brown  -> inverted_u_brown_placement
    3. hex_blue          -> hex_blue_hole
    4. hex_red           -> hex_red_hole

  A part starts being worked on when the executor begins the first step
  naming it, and stops when its place step closes. u_green and
  inverted_u_brown are additionally set down partway through, between their
  reorient and their re-pick, and stand at the reorient frame in the
  meantime. begin_step's object_ids names the part being worked on; this
  ordering is what you fall back on when it does not.

  Each part's effects are judged at one moment: when that part's own place
  step closes. That is the milestone for that part -- the point its end-state
  has come into existence and can be checked. The steps before it in the
  part's span are transit, pick and reorient; the invariants apply throughout
  them, but a part is not yet seated at the end of a lift.

  The executor is free to reach each end-state however it chooses. Extra
  steps, alternative approaches, and steps this plan does not list are all
  acceptable in themselves; the plan is what is expected, not the only thing
  permitted. What matters is that the process requirements hold throughout
  and that each part is correctly seated when its own place step closes. A
  step you do not recognize is judged the same way as any other -- by whether
  the requirements held while it happened, not by whether it was on the plan.

steps:
  # Mirrors fmb_assembly.executor.yaml's clean step_ids EXACTLY, 1:1, in order.
  #
  # This block is NO LONGER get_contract's resolution key. Contracts are
  # addressed by object_id and carry static per-object bounds; nothing here is
  # consulted to load one, and no step_id is ever rejected by that path any
  # more. What this block still is, and its only remaining job, is the
  # watchdog's MAP OF THE EXPECTED PROCESS: the agent diffs each incoming
  # begin_step's step_id against these entries, and a step_id not among them is
  # unplanned and must be named as unplanned in the verdict or run-end rollup.
  #
  # That makes accuracy here load-bearing in a way it was not before. Adding a
  # step_id the executor does not emit on the clean path makes a real
  # divergence look expected and it goes unnamed; removing one it does emit
  # makes a normal step look unplanned and the record fills with false
  # divergence. Do not widen this block "helpfully" with plausible alternates,
  # recovery steps
  #      (pick_hex_red_retry and friends), or anything not in the executor
  #      file's clean sequence -- that would silently swallow exactly the
  #      divergence the watchdog is supposed to meet as unrecognized. An
  #      unrecognized step is not an unwatched step: the active-set
  #      stationarity and in-hand-slippage monitors stay armed across it.
  #
  # contract_clause_groups no longer decides what a single call returns -- a
  # contract is per-object now and carries the union of these across the
  # object's steps. It stays authored per step because it is the record of
  # WHERE in the process each group is judged: only the four place milestones
  # bear effects, since that is where a part's end-state comes into existence.
  # Transit, pick and reorient steps carry invariants only -- the clamp-effort
  # bound applies throughout them, but "the part is seated at its placement
  # frame" is not a thing that can be true at the end of a lift. The agent
  # cannot read the milestone off a contract call's shape any more, so the
  # instruction says it in prose and this block keeps it authored.
  #
  # This task authors NO preconditions. The machinery still exists for tasks
  # that want it, but nothing here loads it: the precondition group includes
  # gripper_is_open, which is false by construction at any step where the
  # gripper is already holding a part, and a per-object contract has no single
  # moment at which "before the pick" is true for all of an object's steps.
  #
  # grasp_width_m is the conformance bound for the grasp_width_error_m effect
  # clause, read structurally by get_contract from THIS file (never from the
  # agent). It must AGREE across every step naming the same object -- it
  # describes the part's graspable geometry, not the step -- and get_contract
  # raises if two of an object's steps disagree. grasp_center_offset is intentionally absent throughout: it is
  # executor command geometry, not a watchdog conformance value. So are the
  # reorient frames -- an intermediate the executor chooses, not an end-state.

  # --- u_green: picked, reoriented (set down and re-picked), placed ---
  - step_id: pick_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [invariants]

  - step_id: reorient_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [invariants]

  - step_id: repick_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [invariants]

  - step_id: place_approach_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [invariants]

  - step_id: place_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [effects, invariants]

  # --- inverted_u_brown: same shape as u_green ---
  - step_id: pick_inverted_u_brown
    object_id: inverted_u_brown
    grasp_width_m: 0.08
    contract_clause_groups: [invariants]

  - step_id: reorient_inverted_u_brown
    object_id: inverted_u_brown
    grasp_width_m: 0.08
    contract_clause_groups: [invariants]

  - step_id: repick_inverted_u_brown
    object_id: inverted_u_brown
    grasp_width_m: 0.04
    contract_clause_groups: [invariants]

  - step_id: place_approach_inverted_u_brown
    object_id: inverted_u_brown
    grasp_width_m: 0.04
    contract_clause_groups: [invariants]

  - step_id: place_inverted_u_brown
    object_id: inverted_u_brown
    grasp_width_m: 0.04
    contract_clause_groups: [effects, invariants]

  # --- hex_blue: no reorient span; picked, lifted, placed ---
  - step_id: pick_hex_blue
    object_id: hex_blue
    grasp_width_m: 0.03
    contract_clause_groups: [invariants]

  - step_id: place_approach_hex_blue
    object_id: hex_blue
    grasp_width_m: 0.03
    contract_clause_groups: [invariants]

  - step_id: place_hex_blue
    object_id: hex_blue
    grasp_width_m: 0.03
    contract_clause_groups: [effects, invariants]

  # --- hex_red: same shape as hex_blue ---
  - step_id: pick_hex_red
    object_id: hex_red
    grasp_width_m: 0.03
    contract_clause_groups: [invariants]

  - step_id: place_approach_hex_red
    object_id: hex_red
    grasp_width_m: 0.03
    contract_clause_groups: [invariants]

  - step_id: place_hex_red
    object_id: hex_red
    grasp_width_m: 0.03
    contract_clause_groups: [effects, invariants]

object_ids: |
  u_green          — FMB U part, graspable. Must end seated at u_green_placement.
  inverted_u_brown — FMB inverted-U part, graspable. Must end seated at
                     inverted_u_brown_placement.
  hex_blue         — hex pin, graspable. Must end seated at hex_blue_hole.
  hex_red          — hex pin, graspable. Must end seated at hex_red_hole.
  base2            — the fixture. NOT graspable, never picked, must stay put.

  Registry acm_allowed_object_pairs covers every pair among u_green, base2,
  hex_blue, hex_red and inverted_u_brown. That is a planner collision-checking
  setting, not a statement of task permission: contact between those parts is
  conformant only insofar as the effect clauses above are satisfied.

run_notes: ""
# Stays empty by design, including in fault-injection runs where the registry
# has been deliberately corrupted: neither the executor nor WatchDog may be
# told that, since being told would invalidate the comparison.
