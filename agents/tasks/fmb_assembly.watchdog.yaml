# WATCHDOG instruction for fmb_assembly.
#
# Contains only WHAT must be true (effects + invariants), never the executor's
# path. The executor may reach the end-state by any route; the watchdog
# verdicts on the end-state and the invariants, not on how the executor got
# there.
#
# Object-level truth lives in model_registry.yaml, shared by both files.

name: fmb_assembly
instruction_spec: |
  Verify that four FMB parts are seated on the base2 fixture: u_green,
  inverted_u_brown, hex_blue and hex_red.

  Each part's required end-state is given by a published TF frame, not by a
  fixed world pose: u_green_placement, inverted_u_brown_placement,
  hex_blue_hole, hex_red_hole. Query the frame to obtain the required pose.
  A destination frame gives the pose the PART must reach, not a gripper pose.

  Effects (must hold when the executor closes each place step):
    - The part is seated at its placement frame, within tolerance.
    - The part was gripped at the width the step calls for and lifted clear
      of where it started.
    - base2 is undisturbed: it is the fixture and is never picked.

    - Missed grasp: a grasp the executor reports as holding the part must
      actually hold it, and must close on that part and not another.

  Invariants (must hold throughout each step):
    - Clamp effort on the part never exceeds what that part tolerates.

    - In-hand slippage: while a part is held, it must not move relative to
      the gripper before it is released.

    - Undisturbed objects: every object a step does not act on must stay
      where it last came to rest until some step acts on it.

  Preconditions: this task has none. Do not look for them and do not treat
  their absence as something missing.

  Note on intermediate handling: u_green cannot be picked in its final
  orientation, so the executor may legitimately set it down partway through
  and re-pick it. A part resting somewhere other than its placement frame
  partway through the run is therefore NOT by itself a violation. Judge each
  part against its placement frame at the point the executor closes that
  part's place step.

step_plan: |
  Four parts must end seated at their published placement frames, each
  gripped within the effort the part tolerates, without slipping in the
  gripper, and without disturbing any part that is not the one currently
  being worked on, or the base2 fixture.

  The parts are worked one at a time, in this order:

    1. u_green           -> u_green_placement
    2. inverted_u_brown  -> inverted_u_brown_placement
    3. hex_blue          -> hex_blue_hole
    4. hex_red           -> hex_red_hole

  A part starts being worked on when the executor begins the first step
  naming it, and stops when its place step closes. u_green is additionally
  set down partway through, between its reorient and its re-pick, and stands
  at the reorient frame in the meantime; the other three are carried straight
  from pick to placement. begin_step's object_ids names the part being worked
  on; this ordering is what you fall back on when it does not.

  Each part's effects are judged at one moment: when that part's own place
  step closes. That is the milestone for that part -- the point its end-state
  has come into existence and can be checked. The steps before it in the
  part's span are transit, pick, and for u_green the reorient; the invariants
  apply throughout them, but a part is not yet seated at the end of a lift.

  The executor is free to reach each end-state however it chooses. Extra
  steps, alternative approaches, and steps this plan does not list are all
  acceptable in themselves; the plan is what is expected, not the only thing
  permitted. What matters is that the process requirements hold throughout
  and that each part is correctly seated when its own place step closes. A
  step you do not recognize is judged the same way as any other -- by whether
  the requirements held while it happened, not by whether it was on the plan.

steps:

  - step_id: pick_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [invariants]

  - step_id: reorient_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [invariants]

  - step_id: repick_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [invariants]

  - step_id: place_approach_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [invariants]

  - step_id: place_u_green
    object_id: u_green
    grasp_width_m: 0.042
    contract_clause_groups: [effects, invariants]

  - step_id: pick_inverted_u_brown
    object_id: inverted_u_brown
    grasp_width_m: 0.08
    contract_clause_groups: [invariants]


  - step_id: place_approach_inverted_u_brown
    object_id: inverted_u_brown
    grasp_width_m: 0.08
    contract_clause_groups: [invariants]

  - step_id: place_inverted_u_brown
    object_id: inverted_u_brown
    grasp_width_m: 0.08
    contract_clause_groups: [effects, invariants]

  # --- hex_blue: no reorient span; picked, lifted, placed ---
  - step_id: pick_hex_blue
    object_id: hex_blue
    grasp_width_m: 0.03
    contract_clause_groups: [invariants]

  - step_id: place_approach_hex_blue
    object_id: hex_blue
    grasp_width_m: 0.03
    contract_clause_groups: [invariants]

  - step_id: place_hex_blue
    object_id: hex_blue
    grasp_width_m: 0.03
    contract_clause_groups: [effects, invariants]

  # --- hex_red: same shape as hex_blue ---
  - step_id: pick_hex_red
    object_id: hex_red
    grasp_width_m: 0.03
    contract_clause_groups: [invariants]

  - step_id: place_approach_hex_red
    object_id: hex_red
    grasp_width_m: 0.03
    contract_clause_groups: [invariants]

  - step_id: place_hex_red
    object_id: hex_red
    grasp_width_m: 0.03
    contract_clause_groups: [effects, invariants]

object_ids: |
  u_green          — FMB U part, graspable. Must end seated at u_green_placement.
  inverted_u_brown — FMB inverted-U part, graspable. Must end seated at
                     inverted_u_brown_placement.
  hex_blue         — hex pin, graspable. Must end seated at hex_blue_hole.
  hex_red          — hex pin, graspable. Must end seated at hex_red_hole.
  base2            — the fixture. NOT graspable, never picked, must stay put.

  Registry acm_allowed_object_pairs covers every pair among u_green, base2,
  hex_blue, hex_red and inverted_u_brown. That is a planner collision-checking
  setting, not a statement of task permission: contact between those parts is
  conformant only insofar as the effect clauses above are satisfied.

run_notes: ""
# Stays empty by design, including in fault-injection runs where the registry
# has been deliberately corrupted: neither the executor nor WatchDog may be
# told that, since being told would invalidate the comparison.
