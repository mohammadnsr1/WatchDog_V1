# EXECUTOR instruction for u_green_pick.
#
# step_id convention: a step_id in this file that corresponds to a step in
# u_green_pick.watchdog.yaml MUST use the exact same step_id string -- that
# identity is what lets the watchdog match this executor's begin_step events
# on the shared timeline. A step_id in THIS file that the watchdog file does
# NOT contain is an executor-only extra/alternate step (class 3) or a
# deliberately faulty step (class 2); the watchdog treats it as an
# unrecognized step per its own prompt, not an error in this file.
#
# Object-level truth (geometry, tolerances, max_clamp_effort) is not
# authored here -- it lives in model_registry.yaml, shared by both files.

name: u_green_pick
instruction_spec: |
  pick up and hold the u_green part 5 cm above its location.

  Preconditions (step 1, pick_u_green):
    - u_green is present in the scene and localized within its registry
      position/orientation tolerances.
    - The gripper is empty (not already holding an object).

  Effects (step 1, pick_u_green):
    - The gripper has grasped u_green: measured gripper width at plateau
      matches this step's declared grasp_width_m within tolerance, and the
      object has lifted at least its registry lift_height_min_m.
    - Grasp clamp effort on u_green never exceeds u_green's registry
      max_clamp_effort.

  Preconditions (step 2, hold u_green):
    - u_green is grasped and lifted.

step_plan: |
  step_id: pick_u_green
  object_id: u_green
  intent: >
    Approach u_green, establish a secure grasp per its contract, and
    lift it clear of the table to a stable hold 5cm above its initial location.

# Structured, machine-readable per-step data. The contract loader and the
# executor's motion/gripper tools read grasp_width_m and grasp_center_offset
# from here -- NOT from the model registry. Prose above is for agent
# reasoning only and is never parsed for these values.
steps:
  - step_id: pick_u_green
    object_id: u_green
    # T_object_grasp_center for a top-down grasp on the U's RIGHT arm.
    # u_green now uses the vertex-baked 2x mesh (config/assets/u_green_2x.obj,
    # points = fmb_u_green.obj points * 2 in meters, scaled uniformly about the
    # object origin). Uniform scaling about the origin scales every linear
    # quantity (position and width) identically and leaves orientation
    # unchanged, so these values are the 1x values doubled -- not
    # re-derived from a fresh midpoint on the 2x mesh:
    #   right arm now occupies X in [0.028, 0.070] (thickness 0.042 m = the
    #   jaw-closing dimension, was 0.021 m), free/graspable over the slot
    #   region Y in [-0.071, -0.008] (was [-0.0355, -0.004]); part is now
    #   0.042 m tall in Z (was 0.021 m), TF at part centre.
    # orientation: 180 deg about (1,1,0)/sqrt(2) -> approach along object -Z
    #   (top-down) with the RG2 jaw axis (grasp-centre +Y, fingers separate
    #   along Y per the URDF) aligned to object +X, so the jaws straddle the
    #   0.042 m arm thickness. tcp_to_grasp_center is identity, so grasp-
    #   centre axes are the tcp axes. (Live jaw sense confirmed in M3.)
    grasp_width_m: 0.042    # measured right-arm thickness (jaw-closing dimension), 2x of 0.021
    grasp_center_offset:
      position: {x: 0.049, y: -0.040, z: 0.022}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}

object_ids: |
  u_green — FMB assembly part, graspable

run_notes: ""
# run_notes stays empty by design, including for fault-injection runs later.
# The agent must never be told the registry is corrupted, or the class-4
# result proves nothing.
