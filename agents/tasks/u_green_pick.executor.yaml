# EXECUTOR instruction for u_green_pick.
#
# step_id convention: a step_id here that corresponds to a step in
# u_green_pick_watchdog.yaml MUST use the exact same step_id string -- that
# identity is what lets the watchdog match this executor's begin_step events
# on the shared timeline. A step_id here that the watchdog file does NOT
# contain is an executor-only extra/alternate step (class 3) or a deliberately
# faulty step (class 2).
#
# Object-level truth (geometry, tolerances, max_clamp_effort) lives in
# model_registry.yaml, shared by both files -- not authored here.

name: u_green_pick
instruction_spec: |
  Pick up u_green and hold it 5 cm above its starting location.

  Carry it out in this order:
    1. Move the arm to a named safe joint pose first, so the planner starts
       from a known-good state and has a better chance of planning the
       approach and the lift.
    2. Find where u_green is (query its pose).
    3. Approach from 5 cm above the grasp point.
    4. Establish a secure grasp using this step's grasp_width_m and
       grasp_center_offset.
    5. Lift u_green 5 cm above its starting location and hold it there.

  Effects (what must be true when the step is done):
    - u_green is grasped: it tracks the gripper (object-to-TCP offset stays
      within the registry position tolerance) and has lifted at least the
      registry lift_height_min_m.
    - u_green has been raised ~5 cm above its starting location and held.

  Invariants (must hold throughout):
    - Grasp clamp effort on u_green never exceeds u_green's registry
      max_clamp_effort.

  There are no preconditions to check for this step.

step_plan: |
  step_id: pick_u_green
  object_id: u_green
  intent: >
    Move to a safe pose, approach u_green from 5 cm above, establish a secure
    grasp per its contract, and lift it to a stable hold 5 cm above its
    initial location.

steps:
  - step_id: pick_u_green
    object_id: u_green
    # T_object_grasp_center for a top-down grasp on the U's RIGHT arm.
    # u_green uses the vertex-baked 2x mesh (config/assets/u_green_2x.obj,
    # points = fmb_u_green.obj points * 2 in meters, scaled uniformly about the
    # object origin). Uniform scaling scales position and width identically and
    # leaves orientation unchanged, so these are the 1x values doubled:
    #   right arm occupies X in [0.028, 0.070] (thickness 0.042 m = jaw-closing
    #   dimension), graspable over slot region Y in [-0.071, -0.008]; part is
    #   0.042 m tall in Z, TF at part centre.
    # orientation: 180 deg about (1,1,0)/sqrt(2) -> approach along object -Z
    #   (top-down), RG2 jaw axis (grasp-centre +Y) aligned to object +X so the
    #   jaws straddle the 0.042 m arm thickness. tcp_to_grasp_center is identity.
    grasp_width_m: 0.042
    grasp_center_offset:
      position: {x: 0.049, y: -0.040, z: 0.0}
      orientation: {x: 1.0, y: 0.0, z: 0.0, w: 0.0}

object_ids: |
  u_green — FMB assembly part, graspable

run_notes: ""
# Stays empty by design, including for fault-injection runs later. The agent
# must never be told the registry is corrupted, or the class-4 result proves
# nothing.