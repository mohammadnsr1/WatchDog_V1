agent: executor
provider: openai
model: gpt-5
api_key_env: OPENAI_API_KEY
max_tokens: 8192
context_budget_tokens: 150000      # elide when the estimate exceeds this
context_keep_recent_turns: 5       # never elide within this many turns

# reasoning_effort: openai only (minimal | low | medium | high), ignored by
# the anthropic provider. thinking_budget_tokens: anthropic only, ignored by
# the openai provider. Both are validated at config load -- see
# agent_harness/config.py -- so a bad value here fails loudly before any
# provider call rather than with an opaque request-time error.
reasoning_effort: medium
thinking_budget_tokens: 4096

system_prompt: prompts/executor_system.txt
task_template: prompts/executor_task.txt

mcp_servers:
  - name: gripper
    command: /usr/bin/python3
    args: ["-m", "robot_backend.mcp_servers.gripper_mcp_server"]
    cwd: "~/watchdog/WatchDog_V1/ros2_ws"
  - name: motion
    command: /usr/bin/python3
    args: ["-m", "robot_backend.mcp_servers.motion_mcp_server"]
    cwd: "~/watchdog/WatchDog_V1/ros2_ws"
  - name: scene
    command: /usr/bin/python3
    args: ["-m", "robot_backend.mcp_servers.scene_mcp_server"]
    cwd: "~/watchdog/WatchDog_V1/ros2_ws"
    env:
      # Read by robot_backend.cell.gate as the default timeout_sec for
      # begin_step/mark_phase's request_go calls. Must equal gate_timeout_sec
      # below -- config.py checks this at load time and refuses to start if
      # they've drifted apart.
      CELL_GATE_TIMEOUT_SEC: "90.0"

loop:
  max_turns: 60

transcript_dir: transcripts

# Timeout ordering (enforced at config load, not just documented here):
# mcp_client_timeout_sec > gate_timeout_sec > expected agent arming turn.
# begin_step/mark_phase can block for as long as the monitoring agent takes
# to arm (up to gate_timeout_sec, at the orchestrator). If mcp_client_timeout_sec
# were <= gate_timeout_sec, this process's own MCP client would abort the
# call while the orchestrator is still legitimately holding it open -- an
# mcp_error that looks like a transport bug and is actually a configuration
# mismatch. Keep this comfortably above gate_timeout_sec (here: +60s).
gate_timeout_sec: 90.0
mcp_client_timeout_sec: 150.0
