agent: executor
provider: openai
model: gpt-5
api_key_env: OPENAI_API_KEY
max_tokens: 4096

system_prompt: prompts/executor_system.txt
task_template: prompts/executor_task.txt

mcp_servers:
  - name: gripper
    command: /usr/bin/python3
    args: ["-m", "robot_backend.mcp_servers.gripper_mcp_server"]
    cwd: "~/watchdog/WatchDog_V1/ros2_ws"
  - name: motion
    command: /usr/bin/python3
    args: ["-m", "robot_backend.mcp_servers.motion_mcp_server"]
    cwd: "~/watchdog/WatchDog_V1/ros2_ws"
  - name: scene
    command: /usr/bin/python3
    args: ["-m", "robot_backend.mcp_servers.scene_mcp_server"]
    cwd: "~/watchdog/WatchDog_V1/ros2_ws"

loop:
  max_turns: 300
  wait_timeout_sec: 120.0
  stop_after_consecutive_timeouts: 2

transcript_dir: transcripts
