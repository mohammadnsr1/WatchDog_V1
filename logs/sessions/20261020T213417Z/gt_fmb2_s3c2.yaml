     note: "nudge collision: base1 peak 22.9 mm, settled 12.7 mm (> 2 mm fixture floor) with a fire (0.0263) -> violation under the batch fixture rule."}
  - {step: pick_line_green, object: u_orange, kind: disturbed,
     note: "nudge collision: seated u_orange peak 20.4 mm vs 0.02 (3 samples over), settled 9.9 mm; no u_orange monitor fired -> unmonitored."}
                                 #              kind: <what>, note: <detail>}]

