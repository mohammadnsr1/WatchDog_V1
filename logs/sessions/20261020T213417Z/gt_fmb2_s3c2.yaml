     note: "INJECTED nudge_object u_brown (0.03, 0, 0) at pick_line_green, 21:45:08.25 (s1_c2_nudge.py): the teleport into base1 ejected seated u_brown ~5.1 m to (0.558, 4.911, -0.188), below the floor; never recovered. Watchdog stationarity fired 0.1049."}
