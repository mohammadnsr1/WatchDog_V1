#
# DOCUMENTATION-ONLY KEYS — recorded for the reviewer, ignored by the scorer:
#   expected_terminal_status, physical_outcome, executor_claimed, notes.
#   They are the operator's record of what actually happened; hand corrections
#   in corrected/*.csv lean on them.
