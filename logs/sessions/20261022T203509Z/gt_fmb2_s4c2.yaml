     note: "u_orange 121 mm off its placement at step close (it never left the bench); executor recorded non_conformant here."}
  - {step: pick_u_orange_attempt3, object: u_orange, kind: slip,
     note: "third grip slipped 51.3 mm (tcp-relative > 0.02 from 20:55:41.0, part rose 6.1 mm); fired 0.0237, recorded non_conformant here."}
