  non_conformant, recovered false (correct). record_observation reported the
  hex_red shift (nudge episode; nudges are conformance-only for the
  observation scorer) and line_green tipping over.
  Injections: benign cube foreign_3596b9 at (0.08, -0.38), at_step=pick_u_orange
  (place_object, observation ground truth) + the nudge (nudge_object).
