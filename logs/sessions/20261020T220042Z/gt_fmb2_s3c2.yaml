executor_claimed: aborted
notes: >
  Fault: nudge_object hex_red (-0.05, 0, 0) at_step=pick_line_green
  (s1_c2_nudge.py, as S1 C2 run10); committed task f37da9da; registry
  92969cc1; agent-side code e1b8529. NATURAL line_green slip + mis-seat and a
  collision knock in the same run.
  Watchdog: hex_red nudge caught by fire (TP); line_green knock caught by fire
  (TP); line_green's slips and failed seating at place_line_green not recorded
