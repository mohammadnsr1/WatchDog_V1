run_id: fmb2_s2c4_run01
task: fmb_assembly_2
scenario: S2
class: 4

expected_final_verdict: non_conformant   # effort invariant broken; cannot be undone
expected_terminal_status: completed   # documentation-only
expected_recovered: true          # operator 2026-10-15: line_green slips/mis-seats were recovered (seated at run end)
fault_origin: injected   # executor-only registry override (batch.yaml Class 4 design)

# Class 4 = registry corruption: the shared (install) registry has u_brown
# max_clamp_effort 10 (sha 32f79017); the EXECUTOR alone loads a copy at 100
# (EXECUTOR_REGISTRY_PATH, sha 008411d8). The robot grips u_brown normally
# (~28), over the watchdog's limit. Expected fault below; correct it to what
# physically happened. The benign cube is observation ground truth only.
violation_occurred: true          # per-run: false if the fault did not physically happen
violation_steps:
  - {step: pick_u_brown, object: u_brown, kind: over_effort,
     note: "Class 4: effort fired 28.19 vs 10 (install registry) at 22:53:04, ~63 sustained; executor believed the limit was 100"}
  - {step: place_line_green, object: line_green, kind: slip_and_misseated,
     note: "NATURAL: slip 0.0204 vs 0.02 (22:58:36), seated 21.9 mm / 24.6 deg off (tol 15 mm / 10 deg)"}
  - {step: reseat_line_green_place, object: line_green, kind: slip_and_misseated,
     note: "NATURAL: slip 0.0202 vs 0.02 (23:01:50) in the unplanned re-seat, 30.1 mm / 43.8 deg off; a second re-seat (reseat2_*) then seated it"}
                                 #              kind: <what>, note: <detail>}]

boundary_grace_s: 3.0

