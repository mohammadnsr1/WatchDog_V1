executor_claimed: completed
notes: >                           # per-run: name every injection made,
  Fault: nudge_object hex_red (-0.05, 0, 0) at pick_line_green, bystander
  (s1_c2_nudge.py); committed task (sha f08439e9); registry ff4a6f96.
