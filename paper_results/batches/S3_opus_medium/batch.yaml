batch_id: S3_opus_medium
date_utc: 2026-10-26            # UTC date of the batch's FIRST valid run (20261026T013751Z)
purpose: scored                 # smoke | scored -- scored batches feed paper numbers

# Provenance (fill BEFORE run 01; code must not change mid-batch)
git_sha: a93c0c85b9ae9c5651b69ac3045c53a228434536
                                # NOT a clean tree: uncommitted at run 01 were batch.yaml / CORRECTIONS.md
