                                # the batch) and isaac/script_editor/s1_c1_inject.py (the visit call added).
                                # No server, prompt or scorer code differs from a93c0c8.
                                # Scorer and prompts must be byte-identical to the
                                # S3 batch: diff against S3/batch.yaml's git_sha.
registry_sha256: 92969cc199868e1a82783be1db7d03b1a5fb5886f4ec15dd31218be956cae8bd
                                # sha256sum ros2_ws/install/robot_backend/share/robot_backend/config/model_registry.yaml
