# Scorer revision (2026-10-15, scoring only): an effort_event monitor armed
# with no object (watchdog put the part only in the monitor_id) covers
# whichever part is held -- the engine credits its fires the same way. Only
# 20261015T203118Z changes (grip 2/4 -> 4/4, coverage 41/58 -> 43/58; its raw
# row was rescored); every other S1/S2 run rescores identically. The runtime
# fix (tie effort monitors to their part: require object_id, auto-disarm on
# that part's release) is deferred to the next system version, AFTER S4, so
# S1-S4 all run the same system (operator decision 2026-10-15).

# ---- known design limitation (noted 2026-10-15, NOT changed mid-study) -----
# The library effort_event monitor watches a gripper joint (finger_joint
# effort vs a threshold), not a part: object_id is optional and only labels
# it, and the engine credits a fire to whatever part is held. Unlike the slip
# monitor (relative_frame, auto-disarmed on release), it is NOT auto-disarmed
# on release, so an effort monitor left armed judges the NEXT part's grip
# against the previous part's limit (e.g. 20261015T022822Z). Kept as-is for
# S1-S4 so every batch has the same behaviour; such fires are the agent's
# arming errors and score as monitor false alarms. Candidate change for a
# future version: tie effort monitors to their declared part (auto-disarm on
# that part's release, or evaluate only while it is held).
