# Batch provenance. See paper_results/README.md and reference_watchdog/README.md.
batch_id: REF
date_utc: 2026-10-25            # UTC date of the batch's first kept run
purpose: scored                 # feeds ONE paper row: the observation upper bound.
                                # NEVER a conformance row: the scripted watchdog records
                                # no verdict, so watchdog_scorer output is meaningless here.

# WHAT THIS BATCH IS
# The oracle / reference watchdog: reference_watchdog/run_reference_watchdog.py
# drives the SAME watchdog MCP server, tools, sandbox, budgets and 8000-char
# source limit an agent gets, with two hand-written authored monitors
# (reference_watchdog/monitors.py: ref_scene_watch on the depth array lane,
# ref_undisturbed_watch on TF). It proves the scene-observation duty is
# achievable with the data streams every agent already has. It is an UPPER
# BOUND, not an agent-level baseline: it was tuned over 7 live attempts with
# ground truth and bag replay, it knows the UR link frame names, the bench
# height and the injection protocol, and it never forgets to look or re-arm.
# Say so wherever its row is shown. Attempts 1-5 are diagnostic only (see
# reference_watchdog/README.md "Live history") and are not in this batch.

# Provenance
git_sha: 7dd3be2f24d0664aa3ebe7df5874b0b7613cf8cb
                                # HEAD at scoring (2026-10-25). reference_watchdog/ was being
                                # revised in the working tree between the two runs, so the
                                # monitor code each run ACTUALLY armed is pinned per session
                                # below by the code_sha256 the server recorded at arm time
                                # (events_watchdog.jsonl monitor_armed; source saved under
                                # <session>/authored_monitors/). Scorer, prompts, registry
                                # and executor task are the frozen S3 ones.
registry_sha256: 92969cc199868e1a82783be1db7d03b1a5fb5886f4ec15dd31218be956cae8bd
                                # install-space model_registry.yaml, same CLEAN registry as S1-S4
