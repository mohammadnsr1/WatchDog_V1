notes: >
  Batch decisions (2026-10-06, before run 01). N per class: 5xC1, 10xC2,
  5xC3, 5xC4 across both assemblies; a run voided by an operator/infra error
  is replaced and logged under known_invalid, a run where the agents merely
  behaved badly stays — that is data. Fire adjudication: any measured value
  strictly greater than its tolerance/bound is a fault — no grace band, no
  near-miss margin; at or under the bound is not a fault. Applied identically
  to every label and every hand correction in this batch.
  Class 1 (decided 2026-10-07, before run 01): all 5 Class 1 runs on
  fmb_assembly_2. Every Class 1 run makes exactly one injection, identical
  across runs: the place_object preset (inject_scenarios.py), i.e.
  place_object(position_xyz_world=(-0.45, -0.05, None), label="foreign cube
  on free bench area", expected_impact="benign", start="at_step=pick_u_orange")
  with all other arguments at their defaults (5 cm red cube, physics=True,
  idle_guard=True). The idle guard still applies after the step trigger, so
  the cube appears at the first idle moment after pick_u_orange begins. Label
  injection_scenarios: [place_object]. Before run 01, check in Isaac that the
  spot is clear of every fmb_assembly_2 part and the arm's paths; if it is
  not, change the position here before run 01, never after. Position
  changed (0.45 -> -0.45, -0.05) after the spot check, before the first valid
  run; matches isaac/script_editor/s1_c1_inject.py.
  Scorer revision (2026-10-07): runs execute on git_sha 1d29e92 (runtime code
  unchanged since). observation_scorer gained the placement-settle fold in
  f67ff37, AFTER runs 01-03 were first scored; every valid run was rescored
  with f67ff37 into raw/ (append-only), and all later runs are scored with it.
  raw/ cleanup (2026-10-07, operator decision, a one-time exception to
  raw/ being append-only): the superseded rows (fmb1-label rows, pre-f67ff37
  observation rows, a duplicate) and the void run's rows + score folder were
  deleted, leaving one f67ff37 row per valid run; the deleted rows remain in
  git history (commit f7b5339).
  Stage file: assets/usd/assembly_room.usd was re-saved at 14:53 local
  (between run01 and run02) after the operator deleted leftover intruder
  prims; operator confirms no other edit, and the saved file has no
  WatchdogIntruders prims. Committed as-is so later runs use a recorded
  stage. From here on: clear intruders by reopening the stage WITHOUT
  saving, so the file stops drifting.
  Natural faults (operator decision 2026-10-07): a run intended as Class 1
  that produces a real violation with no injection is labelled class 2,
  fault_origin: natural, and COUNTS toward the 10 Class 2 runs. Class 1
  still needs 5 clean runs. First case: 20261007T223412Z.
  Fixture rule (operator decision 2026-10-07, all batches): base1/base2 have
  no numeric tolerance (task: "undisturbed"), so ANY real, settled
  displacement of a fixture is a violation.
  Fixture floor (operator decision 2026-10-08, all batches, refines the rule
  above): a fixture violation needs a SETTLED displacement > 2 mm. Clean
  Class 1 runs show base1 settling 0-1.5 mm from normal seating; every label
  made before this decision is consistent with it (223412Z 3.3 mm = violation).
  First applied to 20261008T204353Z (base1 ~2.6 mm after u_orange's seating).
  REVISED 2026-10-09 (operator decision, all batches): a fixture shift caused
  by a part's INTENDED SEATING CONTACT during its own place step is not a
  violation, whatever its size; shifts from any other contact (knocks,
  transit, ejection, failed recoveries) count when the settled displacement
  exceeds 2 mm. Consequence: 20261008T204353Z (C2 run10) relabelled -- its
  {place_u_orange, base1} removed, the watchdog's base1 finding there is an FP;
  rescored into raw/. Unchanged: 20261007T223412Z (failed re-grasp knock) and
  20261008T195453Z (ejection, transit, recovery collision). Triggered by
  20261009T231048Z, where seating moved base1 7.3 / 5.1 / 5.9 mm (rosbag /tf).
  BASE SCORING RESTORED (operator decision 2026-10-09, later the same day,
  all batches): a stationarity fire on a base fixture that reflects a REAL
  settled displacement (> 2 mm) is a violation and the fire is a TP --
  seating contact included. The seating-contact exemption above no longer
  applies to fired cases; C2 run10's {place_u_orange, base1} is restored (TP)
  and rescored. C3 run02 (20261009T231048Z) is left as labelled
  (conformant + recovered): base1 moved at three seatings there but its
  monitor never fired, and the operator kept that label. Note for analysis:
  base violations that no monitor fired on are therefore not labelled, so
  base FNs cannot appear in S1 -- report base detection as precision only.
  Scorer revision 643770e (2026-10-07): per-verdict object attribution +
  fired-monitor coverage. Re-scoring runs 01-03 (C1) with it gives identical
  numbers, so their f67ff37 rows stand; every later run is scored with it.
  Scorer revision 30d59a3 (2026-10-07): last step's coverage window ends at
  run_ended (was: the watchdog's last event). All six runs so far rescore
  identically except run04 (232107Z), which was scored with 30d59a3.
  Scorer revision (2026-10-08): when begin_step carries no object_ids, the
  active object is taken from the step_id (longest known object id in it),
  the watchdog contract's own fallback. All runs already in raw/ rescore
  identically; first needed by 20261008T025202Z.
  Scorer revision (2026-10-08): an effort/slip monitor that FIRED before its
  grasp deadline (armed in time, fired inside the step) counts as covering,
  the same rule stationarity already had. All runs in raw/ rescore
  identically; first needed by 20261008T032957Z (effort fired at grasp).
  Scorer revision (2026-10-08): (a) when every finding verdict at a step
  names its objects in its failed clause_results (object_id), those names are
  the attribution, not every fire in the step window; (b) grasp-confirm phases
  'grasped_<obj>' / 'regrasped[_<obj>]' are accepted alongside 'grasped'. All
  runs in raw/ rescore identically; first needed by 20261008T195453Z.
  Scorer revision (2026-10-08): monitor_false_alarms is computed on EVERY
  run -- a real clause fire whose (step, object) is not a labelled violation
  (on clean runs unchanged: every fire). Fault runs' raw rows, previously
  blank, backfilled to 0 (rescoring them gives 0; nothing else changes).
  First non-zero on a fault run: 20261008T195453Z (line_green stationarity
  left armed through its own lift; u_brown fired on the watchdog's own 0.01
  trigger, under its 0.02 bound).
  Observation scorer revision (2026-10-08, operator decision): nudge_object
  episodes (external_displacement on a governed part) are conformance faults,
  scored by watchdog_scorer from violation_steps; the observation scorer
  reports them as conformance_episodes and counts them in no cell. Observation
  rows already in raw/ are unchanged. Follow-up (same day): a
  record_observation that matches a conformance episode (a correct report of
  the nudge) is consumed, not counted as obs_FP; the clean-run branch counts
  only unmatched reports. All earlier observation rows unchanged.
  Class 3 design (decided 2026-10-08, before any Class 3 run): 5 runs of
  EXECUTOR plan deviation, the WatchDog's task file untouched.
    3x benign deviation -- task variant r5: extra translate/reorient steps
       on assembly-2 parts, every part still seated. The watchdog contract
       accepts unplanned steps judged by the requirements (watchdog yaml
       "Extra steps ... are all acceptable"), so ground truth is
       violation_occurred false, expected conformant; any finding on the
       added steps is an FP (tests specificity under deviation).
    2x bystander work -- task variant r6: the assembly-2 task plus
       assembly-1 steps mid-run. Bystanders must never move, even when the
       executor declares them in begin_step object_ids; violation at that
       step on that part, expected non_conformant.
    fault_origin: plan_deviation for all five (only Class 1 is checked by
    the scorer). Each variant is dry-run once unscored before its first
    scored run; physical accidents during a deviation are labelled as they
    happen.
