# ---- batch design (decided 2026-10-23, before run 01) ------------------------
# S4 (executor self-monitoring, NO watchdog session) with the EXECUTOR on Opus at MEDIUM effort.
# Everything else is FROZEN to the S4 protocol: fmb_assembly_2, same scorer code,
# same prompts, same classes. Only the executor's model and effort change vs S4.
# INJECTIONS, every run, as S3_opus_medium (pasted unchanged from
# isaac/script_editor/s1_c1_inject.py):
#   place_object(position_xyz_world=(0.08, -0.38, None),
#                label="foreign cube on free bench area",
#                expected_impact="benign", start="at_step=pick_u_orange")
#   visit(shape="hand", dwell_position=(0.45, -0.10), dwell_s=4.0, speed_mps=0.3,
#         label="forearm over the work area", expected_impact="benign",
#         start="at_step=place_line_green")
# The S4 (Sonnet) batch injected the cube only; the cube is placed first, so cube
# detection stays comparable with it, and both events compare with S3_opus_medium.
# STAGE: runs with the inverted_u_brown TF/mesh offset FIXED (operator, 2026-10-26);
# the S4 (Sonnet) batch ran with it. inverted_u_brown never moves, so conformance is
# unaffected.
# Target: 5 scorable runs (a run that aborts before pick_u_orange has no cube and
# is not observation-scorable; launch 6-7 to get 5). Plan Class 1; a natural
# fault makes a run Class 2 and it still counts, as in S1-S4.
# Observation metrics are the primary outcome; conformance metrics are reported
# beside them as a small-n read. Report counts, not rates (n=5).
# Defends the architecture claim: does a stronger self-monitoring executor close the
# S4 coverage gap (S4 median 0.69 vs S3 0.93)? Run this cell first at medium; add
# S4_opus_low only if coverage jumps markedly. Bringup guard_mode:=unguarded,
# ./run_executor.sh s4 2, score with s4_scorer.py + observation_scorer.py --role executor.
# Reference row (upper bound) for the observation table: paper_results/batches/REF.

