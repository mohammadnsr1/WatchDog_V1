# ---- batch design (decided 2026-10-23, before run 01) ------------------------
# S3 (authored monitors only) with the WATCHDOG on Opus at LOW effort; executor unchanged (Sonnet-5 low).
# Everything else is FROZEN to the S3 protocol: fmb_assembly_2, the pinned
# benign cube (place_object at (0.08,-0.38,None), start="at_step=pick_u_orange",
# pasted unchanged from S2/batch.yaml notes), same scorer code, same prompts,
# same classes. Only the model and effort named above change.
# Target: 5 scorable runs (a run that aborts before pick_u_orange has no cube and
# is not observation-scorable; launch 6-7 to get 5). Plan Class 1; a natural
# fault makes a run Class 2 and it still counts, as in S1-S4.
# Observation metrics are the primary outcome; conformance metrics are reported
# beside them as a small-n read. Report counts, not rates (n=5).
# Cell 1 of the Opus observation study: isolates the MODEL effect vs S3 (Sonnet-5 low).
# Fisher exact vs S3's 0 of 22 detections: 2/5 -> p=0.03, 3/5 -> p=0.003; 1/5 is an anecdote.
