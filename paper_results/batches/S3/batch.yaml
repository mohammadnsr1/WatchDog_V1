# ---- batch design (decided 2026-10-14, BEFORE run 01) -----------------------
# REPEAT S1 exactly; the only differences are the scenario's monitor surface
# (S2: library + authored/custom monitors; S3: authored only; S4: executor
# self-monitoring, no watchdog) and that the custom monitors are evaluated.
# Counts: Class 1 = 5, Class 2 = 10, Class 3 = 5, Class 4 = 3 (fixed now, for
# S2, S3 and S4 alike -- no extension after seeing results).
#   C1: committed task + benign cube.
#   C2: as S1 -- 2x r4 wrong object (+ r4_allow_finger_contact.py), 1x r2
#       grasp offset, 1x operator drop (c2_drop_open_gripper.py), 2x r3 shared
#       registry u_brown max_clamp_effort 10, 2x nudge (u_brown seated, hex_red
#       bystander; s1_c2_nudge.py); a run planned for another class that
#       produces a natural violation becomes Class 2 and counts (as in S1).
#   C3: 3x r5 benign deviation + 2x r6 bystander work (hex_red into its hole).
#   C4: install registry u_brown limit 10, executor copy at 100
#       (EXECUTOR_REGISTRY_PATH), committed task.
#   Benign cube at (0.08, -0.38) at_step=pick_u_orange in every run
#   (s1_c1_inject.py; s1_c2_nudge.py queues it on nudge runs).
#   Replacement: operator/infra errors are rerun; agent behaviour is data.
# Scoring: as S1 -- watchdog_scorer (+ observation_scorer after
# audit_intruder_leak.py) with every S1 rule (strictly-greater adjudication,
# fixture rule, continuation, nudges conformance-only). Custom monitors:
# authored_TP/FP/FN/TN, authored_param_accuracy, release-window and probe
# fires as already implemented; COVERAGE now credits authored clause monitors
# by what they read (scorer revision 2026-10-14, S1 rescored identically).
# Pre-run fixes carried in: r4 re-aimed for the current layout (offset
# 0.1305,-0.0204,-0.0161), nudge-script cube moved to (0.08,-0.38).
# Revision 2026-10-16, BEFORE run 01 (a voided trial run, deleted, showed the
# agent arming every stationarity monitor as purpose="observation" with
# invented thresholds): (1) prompt BLOCK_I (S2/S3/S4 only) now says monitors
# over requirements that can change the verdict are purpose="clause" with spec
# thresholds, observation is for watching the scene; S2 ran WITHOUT this
# passage. (2) scorer: the observation exemption is decided by what a monitor
# reads (camera-only exempt; pose/joint/frame reads score as clause), the S3
# coverage grid is no longer blanked, new column obs_flag_on_clause_reads;
# S1+S2 rows verified cell-identical under the new scorer. (3) observation
# strategy label continuous_pose_monitor.
# Scorer revision 2026-10-19 (after run 20261019T194220Z, scoring only --
# runs unaffected): additive columns fault_TP_by_fire / fault_TP_by_check
# (TP caught by a monitor fire in its step vs by the watchdog's own step-end
# check). No other column changes (all S1/S2/S3 rows verified). Raw rows
# scored before it lack the two columns; scripts/backfill_tp_mode.py fills
# them in corrected/ at Phase 6 (done for S1 and S2 the same day).
# Scorer revision 2026-10-19 #2 (after 20261019T221524Z, scoring only):
# stationarity coverage merges an object's OVERLAPPING live intervals, so an
# arm-new-then-disarm-old hand-off between monitors is continuous coverage.
# Changed only fmb2_s3c1_run03 (stationarity 78/108 -> 90/108, arming
# 86/116 -> 98/116); all other S1/S2/S3 cells identical. That run's raw rows
# were removed and the run rescored on the fixed scorer (operator decision,
# same day; nothing had been committed), so raw/ carries the new values.
# Scorer revision 2026-10-20 (after 20261020T211657Z, scoring only): fires of
# an authored monitor that reads several objects are attributed to the read
# object named earliest in the fire detail (the armed object_id is one of
# many). Changed no S1/S2/S3 cell (58 rows verified).
# Scorer revision 2026-10-20 #2 (after 20261020T225108Z, scoring only): an
# authored monitor armed with no object_id (object_unresolved) that reads
# several objects has its threshold checked against the install registry at
# its declared field for every read object that has it; equal -> verified
# (operator rule). Changed only fmb2_s3c3_run01's authored_param_accuracy
# (0/1 -> 1/1) over 62 S1/S2/S3 rows. Extended (#3, after 20261020T234442Z) to
# threshold_source "structural" (no threshold_param): field taken from the
# params' declared raw_spec source; changed only fmb2_s3c3_run02 (10/14 ->
# 14/14) over 64 rows.
# EXECUTOR TASK CHANGED MID-BATCH (operator, 2026-10-19; recorded per run as
# run_task_sha256): runs through 20261019T202216Z used the committed task
# 4166cca0. 20261019T204942Z-230955Z used an UNCOMMITTED working-tree edit
# 103ee800 (place_u_brown target_offset x -0.0005). From 20261020T001013Z the
# task is f37da9da, committed in 9ee44be: that edit plus
# place_approach_inverted_u_yellow standoff y -0.12 -> -0.08 and
# place_inverted_u_yellow motion scaling 0.1 -> 0.05 with goal tolerances
# 0.0001 m / 0.001 rad. The WatchDog's task file never changed.
# REMAINING CLASS 2 PLAN (operator, 2026-10-20, after C2 run05; 5 naturals
# already count): 2x r2 missed grasp, 1x r4 wrong object (+
# r4_allow_finger_contact.py), 2x nudge (s1_c2_nudge.py: u_brown (0.03,0,0)
# at pick_line_green, hex_red (-0.05,0,0) at pick_line_green, as S1). This
# replaces the design's 2x r4 / 1x r2 / 1x drop / 2x r3 for S3. The r2/r4
# variants run UNCHANGED from S2 (r2 0d7ec902, r4 188a3acc) for a 1:1 fault
# comparison with S2 -- so they do NOT carry the 9ee44be base-task edits
# (u_brown target_offset, inverted_u_yellow approach/motion); nudge runs use
# the committed task f37da9da.
# S3 launch: ./run_watchdog.sh s3 2 (authored monitors only: isolation check expects
# arm_custom_monitor + dry_run_custom_monitor and NO arm_monitor). Labels: copy the
# S1 gt_ templates and set scenario: S3. Observation scorer: --scenario S3.
# Library coverage/family grid is blank by design; detection cells are authored_*.
# Fire adjudication: any measured value strictly greater than its bound is a fault.
