# Executor task: agents/tasks/fmb_assembly_2_s4.executor.yaml, re-derived on
# 2026-10-21 (its steps were stale; now = the committed base task f37da9da's
# steps + the S4 blocks). Variants: S4 versions derived from the S1-S3 variant
# files (unchanged from S2/S3, as decided for S3): runs/fmb_assembly_2_s4.rN
# launched with EXECUTOR_VARIANT=rN ./run_executor.sh s4 2. r3 and Class 4 are
# registry edits on the plain S4 task (C4: executor copy 008411d8 via
# EXECUTOR_REGISTRY_PATH). Class 2 composition follows S3's: 2x r2, 1x r4,
